name: Fetch Tide Data

on:
  workflow_dispatch:
  schedule:
    - cron: "20 3 1 * *"  # månedlig

permissions:
  contents: write

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute date range (last 365 days)
        id: dates
        run: |
          set -euo pipefail
          FROM=$(date -u -d "365 days ago" +%Y-%m-%d)
          TO=$(date -u -d "tomorrow" +%Y-%m-%d)
          echo "from=$$FROM" >> "$$GITHUB_OUTPUT"
          echo "to=$$TO" >> "$$GITHUB_OUTPUT"

      - name: Build URL (use secret if set)
        id: build
        env:
          TIDE_API_URL: ${{ secrets.TIDE_API_URL }}
        run: |
          set -euo pipefail
          if [ -n "${TIDE_API_URL:-}" ]; then
            echo "url=$$TIDE_API_URL" >> "$$GITHUB_OUTPUT"
          else
            PLACE="Bergen"
            REFCODE="cd"
            INTERVAL="10"
            FROM="${{ steps.dates.outputs.from }}"
            TO="${{ steps.dates.outputs.to }}"
            echo "url=https://api.sehavniva.no/tideapi.php?place=$${PLACE}&file=xml&datatype=all&interval=$${INTERVAL}&refcode=$${REFCODE}&fromtime=$${FROM}&totime=$${TO}" >> "$$GITHUB_OUTPUT"
          fi

      - name: Download XML from Kartverket
        run: |
          set -euo pipefail
          mkdir -p Tidevanns
          URL="${{ steps.build.outputs.url }}"
          echo "Fetching: $URL"
          curl -fsSL "$URL" -o Tidevanns/Tidevann.xml.tmp
          head -c 8000 Tidevanns/Tidevann.xml.tmp | grep -Eiq '<(tide|waterlevel)\b'
          mv -f Tidevanns/Tidevann.xml.tmp Tidevanns/Tidevann.xml

      - name: Commit if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- Tidevanns/Tidevann.xml; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Tidevanns/Tidevann.xml
          git commit -m "Update Tidevann.xml (auto via GH Actions)"
          git push

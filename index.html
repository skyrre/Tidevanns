<!DOCTYPE html><html lang="nb">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tidevann – Bergen (statisk)</title>  <base href="/Tidevanns/">
  <meta name="description" content="Statisk tidevannsgraf for Bergen med lokal Tidevann.xml, pan/hover i et robust mørkt tema." />
  <link rel="canonical" href="https://skyrre.github.io/Tidevanns/" />
  <meta name="color-scheme" content="dark">  <style>
    /* Alt er navngitt med tv-* for å unngå kollisjon med globale stiler (f.eks. .btn, .card) */
    .tv-root {
      --bg: #0d1117;
      --fg: #c9d1d9;
      --muted: #8b949e;
      --accent: #58a6ff;
      --grid: #1f242d;
      --card: #0f141a;
      --border: #30363d;

      --sea-top: #3b8fc7;   /* lysere blå i toppen */
      --sea-bottom: #0b2f49;/* mørkere blå nederst */
      --land-top: #173329;  /* diskret grønnlig over kurven */
      --land-bottom: #0e211c;

      --tooltip-bg: rgba(13, 17, 23, 0.97);
      --tooltip-border: rgba(255,255,255,0.08);
      --shadow: 0 6px 24px rgba(0,0,0,0.35);

      color-scheme: dark;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      line-height: 1.45;
    }
    .tv-root *, .tv-root *::before, .tv-root *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #000 !important; } /* dekk ev. globale tema */
    .tv-container { width: min(1100px, 100%); margin: 0 auto; padding: 16px; }
    .tv-header { padding-top: 20px; }
    .tv-h1 { font-size: 1.6rem; margin: 0 0 6px; }
    .tv-sub { color: var(--muted); font-size: 0.95rem; margin-bottom: 14px; }

    .tv-controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0 16px; }
    .tv-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .tv-spacer { flex: 1; }

    .tv-btn {
      appearance: none;
      border: 1px solid var(--border);
      background: #161b22;
      color: var(--fg);
      padding: 8px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      box-shadow: var(--shadow);
      transition: border-color .15s ease, background-color .15s ease, color .15s ease;
    }
    .tv-btn:hover { border-color: #3a434d; background: #19202a; }
    .tv-btn[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(88,166,255,0.18), var(--shadow); }
    .tv-btn-icon { width: 40px; height: 40px; display: inline-grid; place-items: center; font-size: 18px; padding: 0; }

    .tv-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: clip;
      box-shadow: var(--shadow);
    }
    .tv-card h2 { font-size: 1rem; margin: 0; padding: 12px 14px; border-bottom: 1px solid var(--border); }
    .tv-pad { padding: 12px; }

    .tv-legend { display: flex; gap: 14px; align-items: center; color: var(--muted); font-size: 0.9rem; margin-top: 8px; }
    .tv-swatch { width: 18px; height: 4px; border-radius: 3px; background: var(--accent); display: inline-block; vertical-align: middle; margin-right: 6px; }

    .tv-muted { color: var(--muted); }
    .tv-stat-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 8px; }
    .tv-stat { background: var(--card); border: 1px dashed var(--border); border-radius: 10px; padding: 10px; }
    .tv-stat .tv-label { color: var(--muted); font-size: 0.85rem; }
    .tv-stat .tv-val { font-weight: 700; font-size: 1.1rem; }

    .tv-chart-wrap { position: relative; width: 100%; height: 420px; }
    .tv-chart { width: 100%; height: 100%; display: block; }

    .tv-tooltip {
      position: absolute; pointer-events: none; transform: translate(-50%, -100%);
      background: var(--tooltip-bg); color: var(--fg); border: 1px solid var(--tooltip-border);
      border-radius: 10px; padding: 8px 10px; font-size: 12px; white-space: nowrap; z-index: 5;
      box-shadow: var(--shadow);
    }
    .tv-tooltip .tv-em { font-weight: 700; }

    .tv-footer { padding: 26px 16px 40px; color: var(--muted); text-align: center; }
  </style></head>
<body>
  <div class="tv-root">
    <header class="tv-container tv-header">
      <h1 class="tv-h1" id="title">Tidevann – (statisk)</h1>
      <div class="tv-sub" id="subtitle">Leser data fra Tidevann.xml (ingen API-kall). Bla med piltaster/knapper eller dra i grafen.</div>  <div class="tv-controls">
    <div class="tv-row" role="group" aria-label="Tidsvalg">
      <button class="tv-btn" data-range="1d" aria-pressed="true">I dag (24t)</button>
      <button class="tv-btn" data-range="3d">Neste 3 dager</button>
      <button class="tv-btn" data-range="7d">Uke</button>
    </div>

    <span class="tv-spacer"></span>

    <div class="tv-row" role="group" aria-label="Bla i tid">
      <button class="tv-btn tv-btn-icon" id="pan-left" title="Bla venstre (←)">←</button>
      <button class="tv-btn tv-btn-icon" id="pan-right" title="Bla høyre (→)">→</button>
    </div>

    <span class="tv-spacer"></span>

    <div class="tv-row" style="font-size:0.9rem">
      <span id="dataset-meta" class="tv-muted">Laster …</span>
    </div>
  </div>
</header>

<main class="tv-container">
  <section class="tv-card" style="grid-column: 1 / -1;">
    <h2>Graf</h2>
    <div class="tv-pad">
      <div class="tv-chart-wrap" id="chart-wrap">
        <canvas class="tv-chart" id="chart" aria-label="Tidevannsgraf"></canvas>
        <div class="tv-tooltip" id="tooltip" style="display:none"></div>
      </div>
      <div class="tv-legend">
        <span><span class="tv-swatch"></span>Vannstand (m)</span>
      </div>
      <div class="tv-stat-grid">
        <div class="tv-stat"><div class="tv-label">Minimum (visning)</div><div class="tv-val" id="stat-min">–</div></div>
        <div class="tv-stat"><div class="tv-label">Maksimum (visning)</div><div class="tv-val" id="stat-max">–</div></div>
        <div class="tv-stat"><div class="tv-label">Snitt (visning)</div><div class="tv-val" id="stat-avg">–</div></div>
      </div>
      <div class="tv-muted" style="margin-top:8px" id="stat-info">–</div>
    </div>
  </section>
</main>

<footer class="tv-footer">
  Tid vises i din lokale tidssone (<span id="tz"></span>). Dra for å bla. Bruk piltaster ← → for å flytte vinduet.
</footer>
  </div>  <script>
    const XML_URLS = ['Tidevann.xml', 'https://skyrre.github.io/Tidevanns/Tidevann.xml'];

    let allPoints = [];    // {t: Date, v: number, src: 'obs'|'pred'|'H'|'L'|string}
    let dataExtent = null; // { tMin, tMax, vMin, vMax }
    let viewFrom = null, viewTo = null;
    let viewLenMs = 24 * 3600e3; // 24t
    let currentRangeKey = '1d';

    const $ = (s) => document.querySelector(s);
    const $$ = (s) => Array.from(document.querySelectorAll(s));

    document.addEventListener('DOMContentLoaded', () => {
      $('#tz').textContent = Intl.DateTimeFormat().resolvedOptions().timeZone || 'lokal tid';

      $$('.tv-btn[data-range]').forEach(btn => {
        btn.addEventListener('click', () => {
          $$('.tv-btn[data-range]').forEach(b => b.setAttribute('aria-pressed', 'false'));
          btn.setAttribute('aria-pressed', 'true');
          currentRangeKey = btn.dataset.range;
          viewLenMs = rangeToMs(currentRangeKey);
          placeWindowAroundNow();
          renderAll();
        });
      });

      $('#pan-left').addEventListener('click', () => panBy(-0.5));
      $('#pan-right').addEventListener('click', () => panBy(0.5));

      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') { panBy(-0.5); e.preventDefault(); }
        else if (e.key === 'ArrowRight') { panBy(0.5); e.preventDefault(); }
      });

      loadXml();
      window.addEventListener('resize', debounce(renderChart, 80));
    });

    async function loadXml() {
      try {
        const { text } = await fetchFirstWorking(XML_URLS);
        const cleanText = sanitizeXmlText(text);
        const doc = new DOMParser().parseFromString(cleanText, 'application/xml');
        if (doc.querySelector('parsererror')) throw new Error('Ugyldig XML');

        const parsed = parseSehavnivaXml(doc);
        allPoints = parsed.points;
        if (!allPoints.length) throw new Error('Fant ingen waterlevel-punkter i XML');

        if (parsed.meta.name) {
          $$('#title').textContent = `Tidevann – $${parsed.meta.name} (statisk)`;
          $$('#subtitle').textContent = `Lokal fil: Tidevann.xml (enhet: meter, ref: $${parsed.meta.ref || '—'})`;
        }

        const tMin = allPoints[0].t;
        const tMax = allPoints[allPoints.length - 1].t;
        const vs = allPoints.map(p => p.v).filter(Number.isFinite);
        const vMin = Math.min(...vs);
        const vMax = Math.max(...vs);
        dataExtent = { tMin, tMax, vMin, vMax };

        $$('#dataset-meta').textContent = `Punkter: $${allPoints.length} • Periode: ${fmtDate(tMin)} – ${fmtDate(tMax)}`;

        viewLenMs = rangeToMs(currentRangeKey);
        placeWindowAroundNow();
        setupInteractions();
        renderAll();
      } catch (err) {
        console.error(err);
        $$('#dataset-meta').innerHTML = `<span style="color:#e35d5b;font-weight:700">Feil:</span> $${err.message}`;
      }
    }

    function rangeToMs(key) {
      if (key === '1d') return 24 * 3600e3;
      if (key === '3d') return 3 * 24 * 3600e3;
      if (key === '7d') return 7 * 24 * 3600e3;
      return 24 * 3600e3;
    }

    function placeWindowAroundNow() {
      if (!dataExtent) return;
      const now = new Date();
      let start = now.getTime();
      let end = start + viewLenMs;

      const min = dataExtent.tMin.getTime();
      const max = dataExtent.tMax.getTime();
      if (end > max) { end = max; start = Math.max(min, end - viewLenMs); }
      if (start < min) { start = min; end = Math.min(max, start + viewLenMs); }

      viewFrom = new Date(start);
      viewTo = new Date(end);
    }

    function panBy(fraction) {
      const span = viewTo - viewFrom;
      let shift = span * fraction;
      let s = viewFrom.getTime() + shift;
      let e = viewTo.getTime() + shift;
      const min = dataExtent.tMin.getTime();
      const max = dataExtent.tMax.getTime();

      if (s < min) { e += (min - s); s = min; }
      if (e > max) { s -= (e - max); e = max; }

      viewFrom = new Date(s);
      viewTo = new Date(e);
      renderAll();
    }

    function setupInteractions() {
      const canvas = $('#chart');
      const wrap = $('#chart-wrap');

      let dragging = false;
      let dragStartX = 0;
      let startFrom = 0, startTo = 0;
      let hoverPoint = null;

      const getPlotGeom = () => {
        const dpr = Math.max(1, window.devicePixelRatio || 1);
        const w = wrap.clientWidth;
        const h = wrap.clientHeight;
        const pad = { L: 56, R: 16, T: 20, B: 32 };
        return { dpr, w, h, pad, plotW: w - pad.L - pad.R, plotH: h - pad.T - pad.B };
      };

      function clientToTime(xClient) {
        const { pad, plotW } = getPlotGeom();
        const rect = canvas.getBoundingClientRect();
        const x = xClient - rect.left;
        const tMin = viewFrom.getTime();
        const tMax = viewTo.getTime();
        const clamped = Math.max(pad.L, Math.min(rect.width - pad.R, x));
        const ratio = (clamped - pad.L) / plotW;
        return new Date(tMin + ratio * (tMax - tMin));
      }

      function onPointerDown(e) {
        dragging = true;
        const pt = ('touches' in e && e.touches && e.touches[0]) ? e.touches[0] : e;
        dragStartX = pt.clientX;
        startFrom = viewFrom.getTime();
        startTo = viewTo.getTime();
        canvas.setPointerCapture?.(e.pointerId || 1);
      }
      function onPointerMove(e) {
        const pt = ('touches' in e && e.touches && e.touches[0]) ? e.touches[0] : e;
        const t = clientToTime(pt.clientX);
        hoverPoint = nearestPointAtTime(t);
        positionTooltip(pt.clientX, pt.clientY, hoverPoint);
        if (dragging) {
          const { plotW } = getPlotGeom();
          const span = startTo - startFrom;
          const dx = pt.clientX - dragStartX;
          const dt = -dx / plotW * span;
          let s = startFrom + dt;
          let e2 = startTo + dt;
          const min = dataExtent.tMin.getTime();
          const max = dataExtent.tMax.getTime();
          if (s < min) { e2 += (min - s); s = min; }
          if (e2 > max) { s -= (e2 - max); e2 = max; }
          viewFrom = new Date(s);
          viewTo = new Date(e2);
          renderAll(hoverPoint);
        } else {
          renderAll(hoverPoint);
        }
      }
      function onPointerUp(e) {
        dragging = false;
        canvas.releasePointerCapture?.(e.pointerId || 1);
      }
      function onLeave() {
        hoverPoint = null;
        $('#tooltip').style.display = 'none';
        renderAll();
      }

      canvas.addEventListener('pointerdown', onPointerDown);
      window.addEventListener('pointermove', onPointerMove);
      window.addEventListener('pointerup', onPointerUp);
      canvas.addEventListener('pointerleave', onLeave);
    }

    function positionTooltip(clientX, clientY, p) {
      const tip = $('#tooltip');
      const wrap = $('#chart-wrap');
      if (!p) { tip.style.display = 'none'; return; }
      tip.style.display = 'block';
      tip.innerHTML = `<span class="tv-em">${fmtNum(p.v)} m</span><br>${fmtDateTime(p.t)}${p.src ? ` • ${srcLabel(p.src)}` : ''}`;
      const rect = wrap.getBoundingClientRect();
      const x = clientX - rect.left;
      const y = clientY - rect.top;
      tip.style.left = `${x}px`;
      tip.style.top = `${y - 10}px`;
    }

    function nearestPointAtTime(t) {
      if (!allPoints.length) return null;
      const t0 = viewFrom.getTime(), t1 = viewTo.getTime();
      let lo = lowerBound(allPoints, t0);
      let hi = upperBound(allPoints, t1);
      if (hi <= lo) { lo = 0; hi = allPoints.length; }
      let best = null, bestDt = Infinity;
      for (let i = lo; i < hi; i++) {
        const p = allPoints[i];
        const dt = Math.abs(p.t - t);
        if (dt < bestDt) { best = p; bestDt = dt; }
      }
      return best;
    }
    function lowerBound(arr, t) { let l = 0, r = arr.length; while (l < r) { const m = (l + r) >> 1; (arr[m].t.getTime() < t ? l = m + 1 : r = m); } return l; }
    function upperBound(arr, t) { let l = 0, r = arr.length; while (l < r) { const m = (l + r) >> 1; (arr[m].t.getTime() <= t ? l = m + 1 : r = m); } return l; }

    function renderAll(hoverPoint = null) {
      renderStats();
      renderChart(hoverPoint);
    }

    function filteredInView() {
      if (!dataExtent) return [];
      const from = viewFrom, to = viewTo;
      const lo = lowerBound(allPoints, from.getTime());
      const hi = upperBound(allPoints, to.getTime());
      return allPoints.slice(Math.max(0, lo - 1), Math.min(allPoints.length, hi + 1));
    }

    function renderStats() {
      const pts = filteredInView();
      if (!pts.length) {
        $('#stat-min').textContent = '–';
        $('#stat-max').textContent = '–';
        $('#stat-avg').textContent = '–';
        $('#stat-info').textContent = 'Ingen punkter i visningen.';
        return;
      }
      const vs = pts.map(p => p.v);
      const vMin = Math.min(...vs), vMax = Math.max(...vs);
      const avg = vs.reduce((a, b) => a + b, 0) / vs.length;

      $('#stat-min').textContent = `${fmtNum(vMin)} m`;
      $('#stat-max').textContent = `${fmtNum(vMax)} m`;
      $('#stat-avg').textContent = `${fmtNum(avg)} m`;
      $$('#stat-info').textContent = `Viser $${fmtDateTime(viewFrom)} → ${fmtDateTime(viewTo)} • Punkter: ${pts.length}`;
    }

    function renderChart(hoverPoint = null) {
      const wrap = $('#chart-wrap');
      const canvas = $('#chart');
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      const w = wrap.clientWidth, h = wrap.clientHeight;
      if (w === 0 || h === 0) return;

      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
      const ctx = canvas.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, w, h);

      const pad = { L: 56, R: 16, T: 20, B: 32 };
      const plotW = w - pad.L - pad.R;
      const plotH = h - pad.T - pad.B;

      const pts = filteredInView();
      if (!pts.length) {
        ctx.fillStyle = getCSS('--muted'); ctx.font = '14px system-ui,-apple-system,Segoe UI,Roboto,Arial';
        ctx.fillText('Ingen data i visningsvinduet', pad.L + 8, pad.T + 16);
        return;
      }

      // Y-buffer (min 0.2 m eller 10 %)
      let vMin = Math.min(...pts.map(p => p.v));
      let vMax = Math.max(...pts.map(p => p.v));
      const vSpan = Math.max(1e-6, vMax - vMin);
      const padY = Math.max(0.2, vSpan * 0.10);
      vMin -= padY; vMax += padY;

      const tMin = viewFrom.getTime();
      const tMax = viewTo.getTime();

      const xOf = (t) => pad.L + (t - tMin) / (tMax - tMin) * plotW;
      const yOf = (v) => pad.T + plotH - (v - vMin) / (vMax - vMin) * plotH;

      // Bakgrunn (land)
      const landGrad = ctx.createLinearGradient(0, pad.T, 0, pad.T + plotH);
      landGrad.addColorStop(0, getCSS('--land-top'));
      landGrad.addColorStop(1, getCSS('--land-bottom'));
      ctx.fillStyle = landGrad;
      ctx.fillRect(pad.L, pad.T, plotW, plotH);

      // Kurvesti
      const path = new Path2D();
      pts.forEach((p, i) => {
        const x = xOf(p.t.getTime());
        const y = yOf(p.v);
        if (i === 0) path.moveTo(x, y);
        else path.lineTo(x, y);
      });

      // Vann (lysere øverst → mørkere nederst)
      ctx.save();
      const under = new Path2D(path);
      under.lineTo(xOf(pts[pts.length - 1].t.getTime()), pad.T + plotH);
      under.lineTo(xOf(pts[0].t.getTime()), pad.T + plotH);
      under.closePath();
      ctx.clip(under);

      const seaGrad = ctx.createLinearGradient(0, pad.T, 0, pad.T + plotH);
      seaGrad.addColorStop(0, getCSS('--sea-top'));
      seaGrad.addColorStop(1, getCSS('--sea-bottom'));
      ctx.fillStyle = seaGrad;
      ctx.fillRect(pad.L, pad.T, plotW, plotH);
      ctx.restore();

      // Grid
      ctx.strokeStyle = getCSS('--grid');
      ctx.lineWidth = 1;

      // Y-ticks
      const yTicks = niceTicks(vMin, vMax, 5);
      ctx.beginPath();
      for (const yv of yTicks) {
        const y = Math.round(yOf(yv)) + 0.5;
        ctx.moveTo(pad.L, y); ctx.lineTo(w - pad.R, y);
      }
      ctx.stroke();

      // X-ticks
      const xTicks = timeTicks(new Date(tMin), new Date(tMax), plotW);
      ctx.beginPath();
      for (const xt of xTicks) {
        const x = Math.round(xOf(xt.getTime())) + 0.5;
        ctx.moveTo(x, pad.T); ctx.lineTo(x, h - pad.B);
      }
      ctx.stroke();

      // Labels
      ctx.fillStyle = getCSS('--muted');
      ctx.font = '12px system-ui,-apple-system,Segoe UI,Roboto,Arial';
      ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      for (const yv of yTicks) {
        const y = yOf(yv);
        ctx.fillText(fmtNum(yv), pad.L - 8, y);
      }
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      for (const xt of xTicks) {
        const x = xOf(xt.getTime());
        ctx.fillText(fmtTickDate(xt, tMin, tMax), x, h - pad.B + 6);
      }

      // Nullinje
      if (vMin < 0 && vMax > 0) {
        ctx.strokeStyle = 'rgba(255,255,255,0.35)';
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        const y0 = yOf(0);
        ctx.moveTo(pad.L, y0); ctx.lineTo(w - pad.R, y0);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      // Kurve
      ctx.strokeStyle = getCSS('--accent');
      ctx.lineWidth = 2;
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      ctx.beginPath();
      pts.forEach((p, i) => {
        const x = xOf(p.t.getTime());
        const y = yOf(p.v);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      });
      ctx.stroke();

      // Hover
      if (hoverPoint) {
        const xh = xOf(hoverPoint.t.getTime());
        const yh = yOf(hoverPoint.v);
        ctx.strokeStyle = 'rgba(255,255,255,0.4)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(xh + 0.5, pad.T);
        ctx.lineTo(xh + 0.5, pad.T + plotH);
        ctx.stroke();

        ctx.fillStyle = getCSS('--accent');
        ctx.beginPath();
        ctx.arc(xh, yh, 3, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // Utils
    function fmtNum(n) { return (Math.round(n * 100) / 100).toLocaleString('nb-NO', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
    function fmtDate(d) { return d.toLocaleDateString('nb-NO'); }
    function fmtDateTime(d) { return d.toLocaleString('nb-NO', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }).replace(',', ''); }
    function fmtTickDate(d, tMin, tMax) { const spanDays = (tMax - tMin) / 86400000; return spanDays <= 2 ? d.toLocaleTimeString('nb-NO', { hour: '2-digit' }) : d.toLocaleDateString('nb-NO', { day: '2-digit', month: '2-digit' }); }
    function getCSS(v) { return getComputedStyle(document.querySelector('.tv-root')).getPropertyValue(v).trim(); }
    function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
    function niceTicks(min, max, count=5) {
      const span = max - min; if (span === 0) return [min];
      const step = Math.pow(10, Math.floor(Math.log10(span / count)));
      const err = (count * step) / span;
      let nice = step;
      if (err <= 0.15) nice = step * 10;
      else if (err <= 0.35) nice = step * 5;
      else if (err <= 0.75) nice = step * 2;
      const ticks = [];
      const start = Math.ceil(min / nice) * nice;
      for (let v = start; v <= max + 1e-9; v += nice) ticks.push(+v.toFixed(6));
      return ticks;
    }
    function timeTicks(d0, d1, widthPx) {
      const ms = d1 - d0;
      const approxLabels = Math.max(3, Math.floor(widthPx / 110));
      const target = ms / approxLabels;
      const steps = [5*60e3, 10*60e3, 15*60e3, 30*60e3, 60*60e3, 2*60*60e3, 3*60*60e3, 6*60*60e3, 12*60*60e3, 24*60*60e3, 2*24*60*60e3, 3*24*60*60e3, 7*24*60*60e3];
      let step = steps[0];
      for (const s of steps) { if (s >= target) { step = s; break; } }
      const ticks = [];
      const start = alignTime(d0, step);
      for (let t = +start; t <= +d1 + 1; t += step) ticks.push(new Date(t));
      return ticks;
    }
    function alignTime(d, stepMs) { const t = +d; if (stepMs >= 24*3600e3) return new Date(d.getFullYear(), d.getMonth(), d.getDate()); return new Date(Math.floor(t / stepMs) * stepMs); }
    function srcLabel(s) { if (s === 'obs') return 'Observasjon'; if (s === 'pred') return 'Prognose'; if (s === 'H') return 'Høyvann'; if (s === 'L') return 'Lavvann'; return s; }

    async function fetchFirstWorking(urls) {
      let lastErr = null;
      for (const u0 of urls) {
        try {
          const u = addCacheBuster(u0);
          const res = await fetch(u, { cache: 'no-cache', mode: 'same-origin' });
          if (!res.ok) { lastErr = new Error(`HTTP ${res.status} for ${u}`); continue; }
          const txt = await res.text();
          if (!/\<(tide|waterlevel)\b/i.test(txt.slice(0, 1000))) { lastErr = new Error(`Uventet innhold for ${u}`); continue; }
          return { text: txt, url: u };
        } catch (e) { lastErr = e; }
      }
      throw lastErr || new Error('Fant ingen gyldig Tidevann.xml');
    }
    function addCacheBuster(u) { try { const url = new URL(u, location.href); url.searchParams.set('v', String(Date.now())); return url.toString(); } catch { return u; } }
    function sanitizeXmlText(txt) { let s = txt.replace(/^\uFEFF/, ''); const i = s.indexOf('<'); if (i > 0) s = s.slice(i); const j = s.lastIndexOf('>'); if (j >= 0) s = s.slice(0, j + 1); return s; }

    function parseSehavnivaXml(doc) {
      const points = [];
      const meta = { name: doc.querySelector('location')?.getAttribute('name') || '', code: doc.querySelector('location')?.getAttribute('code') || '', ref: doc.querySelector('reflevelcode')?.textContent?.trim() || '' };
      const dataBlocks = Array.from(doc.querySelectorAll('locationdata > data'));
      for (const dataEl of dataBlocks) {
        const unit = (dataEl.getAttribute('unit') || '').toLowerCase();
        const type = (dataEl.getAttribute('type') || '').toLowerCase();
        for (const wl of dataEl.querySelectorAll('waterlevel')) {
          const time = wl.getAttribute('time');
          const valStr = wl.getAttribute('value');
          if (!time || !valStr) continue;
          const t = new Date(time); if (isNaN(t)) continue;
          let v = parseFloat(valStr); if (!isFinite(v)) continue;
          let u = unit || findUnitAttr(wl);
          if (u === 'cm') v = v / 100; else if (u === 'dm') v = v / 10;
          const flag = (wl.getAttribute('flag') || '').toLowerCase();
          const src = flag === 'obs' || type === 'observation' ? 'obs' : (type || flag || 'pred');
          points.push({ t, v, src });
        }
      }
      points.sort((a, b) => a.t - b.t || a.v - b.v);
      const dedup = []; const seen = new Set();
      for (const p of points) { const key = p.t.toISOString().slice(0,16); if (seen.has(key)) continue; seen.add(key); dedup.push(p); }
      return { points: dedup, meta };
    }
    function findUnitAttr(el) { let cur = el; for (let i = 0; i < 5 && cur; i++) { if (cur.getAttribute) { const u = cur.getAttribute('unit') || cur.getAttribute('units') || cur.getAttribute('enhet'); if (u) return u.toLowerCase(); } cur = cur.parentElement; } return ''; }
  </script></body>

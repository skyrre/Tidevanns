<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tidevann – Bergen (statisk)</title>

  <!-- Viktig for GitHub Pages under /Tidevanns/ -->
  <base href="/Tidevanns/">

  <meta name="description" content="Statisk visning av tidevannsdata for Bergen fra Tidevann.xml" />
  <link rel="canonical" href="https://skyrre.github.io/Tidevanns/" />

  <style>
    :root {
      color-scheme: light dark;
      --bg: #0b0b0c;
      --fg: #e9eef3;
      --muted: #9aa6b2;
      --accent: #2f7dd1;
      --grid: #2a2f36;
      --card: #14181d;
      --border: #1f262d;
      --good: #2db071;
      --bad: #d9534f;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f7f8fa;
        --fg: #0f1720;
        --muted: #5c6773;
        --accent: #155eab;
        --grid: #e6ebf1;
        --card: #ffffff;
        --border: #dfe6ee;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      background: var(--bg);
      color: var(--fg);
      line-height: 1.45;
    }
    header, main { width: min(1100px, 100%); margin: 0 auto; padding: 16px; }
    header { padding-top: 20px; }
    h1 { font-size: 1.6rem; margin: 0 0 6px; }
    .sub { color: var(--muted); font-size: 0.95rem; margin-bottom: 14px; }
    .controls {
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0 16px;
    }
    button.btn {
      appearance: none; border: 1px solid var(--border); background: var(--card);
      color: var(--fg); padding: 8px 12px; border-radius: 8px; cursor: pointer; font-weight: 600;
    }
    button.btn[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in oklab, var(--accent) 12%, var(--card)); }
    .info {
      display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0,1fr));
    }
    @media (min-width: 900px) { .info { grid-template-columns: 2fr 1fr; } }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: clip;
    }
    .card h2 { font-size: 1rem; margin: 0; padding: 12px 14px; border-bottom: 1px solid var(--border); }
    .pad { padding: 12px; }
    #chart-wrap { position: relative; width: 100%; height: 340px; }
    #chart { width: 100%; height: 100%; display: block; }
    .legend { display: flex; gap: 14px; align-items: center; color: var(--muted); font-size: 0.9rem; margin-top: 8px; }
    .legend .swatch { width: 14px; height: 3px; border-radius: 2px; background: var(--accent); display: inline-block; vertical-align: middle; margin-right: 6px; }
    table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    thead th {
      text-align: left; font-size: 0.9rem; color: var(--muted);
      position: sticky; top: 0; background: var(--card); border-bottom: 1px solid var(--border);
      padding: 10px 8px;
    }
    tbody td { padding: 8px; border-bottom: 1px dashed var(--border); }
    tbody tr:hover { background: color-mix(in oklab, var(--accent) 8%, var(--card)); }
    .muted { color: var(--muted); }
    .stat-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .stat { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px; }
    .stat .label { color: var(--muted); font-size: 0.85rem; }
    .stat .val { font-weight: 700; font-size: 1.1rem; }
    footer { padding: 30px 16px 50px; color: var(--muted); text-align: center; }
    .error { color: var(--bad); font-weight: 600; }
    .ok { color: var(--good); font-weight: 600; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .spacer { flex: 1; }
    .small { font-size: 0.9rem; }
    .nowrap { white-space: nowrap; }
  </style>
</head>
<body>
  <header>
    <h1>Tidevann – Bergen (statisk)</h1>
    <div class="sub">Leser data fra Tidevann.xml i samme mappe (ingen API-kall).</div>

    <div class="controls">
      <div class="row">
        <button class="btn" data-range="today" aria-pressed="true">I dag</button>
        <button class="btn" data-range="7d">Neste 7 dager</button>
        <button class="btn" data-range="month">Denne måneden</button>
        <button class="btn" data-range="all">Alt</button>
      </div>
      <span class="spacer"></span>
      <div class="row small">
        <span id="dataset-meta" class="muted">Laster …</span>
      </div>
    </div>
  </header>

  <main class="info">
    <section class="card">
      <h2>Graf</h2>
      <div class="pad">
        <div id="chart-wrap"><canvas id="chart"></canvas></div>
        <div class="legend"><span class="swatch"></span>Vannstand (m)</div>
      </div>
    </section>
    <section class="card">
      <h2>Statistikk (filter)</h2>
      <div class="pad">
        <div class="stat-grid">
          <div class="stat">
            <div class="label">Minimum</div>
            <div class="val" id="stat-min">–</div>
          </div>
          <div class="stat">
            <div class="label">Maksimum</div>
            <div class="val" id="stat-max">–</div>
          </div>
          <div class="stat">
            <div class="label">Snitt</div>
            <div class="val" id="stat-avg">–</div>
          </div>
        </div>
        <div class="small muted" style="margin-top:8px" id="stat-info">–</div>
      </div>
    </section>

    <section class="card" style="grid-column: 1 / -1;">
      <h2>Tabell</h2>
      <div class="pad" style="max-height: 50vh; overflow: auto;">
        <table>
          <thead>
            <tr>
              <th>Dato/tid</th>
              <th>Høyde (m)</th>
              <th>Type</th>
            </tr>
          </thead>
          <tbody id="table-body">
            <tr><td colspan="3" class="muted">Laster data …</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <footer>
    Data kilde: Tidevann.xml • Tid vises i din lokale tidssone (<span id="tz"></span>)
  </footer>

  <script>
    const XML_PATH = 'Tidevann.xml'; // Ligger i samme mappe som index.html

    // Global state
    let allPoints = [];  // {t: Date, v: number, type?: 'H'|'L'|'pred'|string}
    let filtered = [];   // nåværende filter
    let dataExtent = null; // {tMin, tMax, vMin, vMax}
    let currentRange = 'today';

    const $ = (sel) => document.querySelector(sel);
    const $$ = (sel) => Array.from(document.querySelectorAll(sel));

    document.addEventListener('DOMContentLoaded', () => {
      $('#tz').textContent = Intl.DateTimeFormat().resolvedOptions().timeZone || 'lokal tid';
      // Knapper
      $$('.btn').forEach(btn => {
        btn.addEventListener('click', () => {
          $$('.btn').forEach(b => b.setAttribute('aria-pressed', 'false'));
          btn.setAttribute('aria-pressed', 'true');
          currentRange = btn.dataset.range;
          applyFilterAndRender();
        });
      });

      loadXml();
      window.addEventListener('resize', debounce(renderChart, 100));
    });

    async function loadXml() {
      try {
        const res = await fetch(XML_PATH, { cache: 'force-cache' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const text = await res.text();

        // Parse til XML DOM
        const doc = new DOMParser().parseFromString(text, 'application/xml');
        // Sjekk parser error
        const parserError = doc.querySelector('parsererror');
        if (parserError) throw new Error('Ugyldig XML');

        allPoints = parseTideXml(doc);
        if (!allPoints.length) throw new Error('Fant ingen datapunkter i Tidevann.xml');

        // Extent
        const tMin = allPoints[0].t;
        const tMax = allPoints[allPoints.length - 1].t;
        const vs = allPoints.map(p => p.v).filter(Number.isFinite);
        const vMin = Math.min(...vs);
        const vMax = Math.max(...vs);
        dataExtent = { tMin, tMax, vMin, vMax };

        // Meta
        $('#dataset-meta').innerHTML = `Punkter: <span class="ok">${allPoints.length}</span> • Periode: ${fmtDate(tMin)} – ${fmtDate(tMax)} • Enhet: meter`;

        // Init
        applyFilterAndRender();
      } catch (err) {
        console.error(err);
        $('#dataset-meta').innerHTML = `<span class="error">Kunne ikke laste Tidevann.xml (${err.message}).</span>`;
        $('#table-body').innerHTML = `<tr><td colspan="3" class="error">Feil ved lasting/parsing av Tidevann.xml.</td></tr>`;
      }
    }

    // Robust parser: prøver vanlige mønstre fra tide-XML (attributter/time + value/height)
    function parseTideXml(doc) {
      const points = [];

      // 1) Samle alle elementer med tid + verdi som attributter
      const allEls = Array.from(doc.querySelectorAll('*'));
      for (const el of allEls) {
        const timeAttr = el.getAttribute('time') || el.getAttribute('date') || el.getAttribute('datetime') || el.getAttribute('tid') || null;
        let valueAttr = el.getAttribute('value') || el.getAttribute('height') || el.getAttribute('val') || el.getAttribute('cm') || null;

        // Noen ganger ligger verdien i tekstinnholdet
        if (!valueAttr) {
          const txt = (el.textContent || '').trim();
          if (txt && /^-?\d+(\.\d+)?$/.test(txt)) valueAttr = txt;
        }

        if (!timeAttr || !valueAttr) continue;

        const t = parseDateGuess(timeAttr);
        if (!t) continue;
        const v = normalizeValueToMeters(parseFloat(valueAttr), el);
        if (!isFinite(v)) continue;

        // Type: H/L/pred hvis finnes
        let type = el.getAttribute('type') || el.tagName.toLowerCase();
        if (type === 'h' || /high/i.test(type)) type = 'H';
        else if (type === 'l' || /low/i.test(type)) type = 'L';
        else if (/pred|forecast|calc/i.test(type)) type = 'pred';
        else type = (type === 'value' || type === 'data' || type === 'point') ? 'pred' : type;

        points.push({ t, v, type });
      }

      // 2) Hvis ingenting funnet, prøv spesifikke kjente stier (fallback)
      if (points.length === 0) {
        const vals = doc.querySelectorAll('value, values > v, points > point');
        vals.forEach(el => {
          const t = parseDateGuess(el.getAttribute('time') || el.getAttribute('date') || el.getAttribute('datetime') || el.querySelector('time')?.textContent);
          const v = normalizeValueToMeters(parseFloat(el.getAttribute('value') || el.getAttribute('height') || el.querySelector('value')?.textContent), el);
          if (t && isFinite(v)) points.push({ t, v, type: 'pred' });
        });
      }

      // Sorter og fjern åpenbare duplikater (same minute)
      points.sort((a, b) => a.t - b.t || a.v - b.v);
      const dedup = [];
      const seen = new Set();
      for (const p of points) {
        const key = p.t.toISOString().slice(0,16); // til minutt
        if (seen.has(key)) continue;
        seen.add(key);
        dedup.push(p);
      }
      return dedup;
    }

    function parseDateGuess(s) {
      if (!s) return null;
      // Håndter "YYYY-MM-DD HH:mm[:ss]" ved å sette inn 'T'
      let str = s.trim();
      if (/^\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}(:\d{2})?$/.test(str)) str = str.replace(' ', 'T');
      // Hvis mangler tidssone, la den tolkes som lokal – vi vil vise i lokal tid uansett
      const d = new Date(str);
      if (isNaN(d)) {
        // Prøv å anta Z
        const d2 = new Date(str + 'Z');
        if (!isNaN(d2)) return d2;
        return null;
      }
      return d;
    }

    // Forsøk å tolke enhet automatisk. Hvis elementer/forfedre sier "cm", konverter til meter.
    function normalizeValueToMeters(val, el) {
      if (!isFinite(val) || !el) return val;
      const unitHints = [];
      let cur = el;
      for (let i = 0; i < 5 && cur; i++) {
        for (const attr of ['unit', 'units', 'enhet']) {
          const u = cur.getAttribute && cur.getAttribute(attr);
          if (u) unitHints.push(u);
        }
        cur = cur.parentElement;
      }
      const hint = unitHints.join(' ').toLowerCase();
      if (/\bcm\b/.test(hint)) return val / 100;
      return val; // antar meter
    }

    function applyFilterAndRender() {
      if (!allPoints.length || !dataExtent) return;

      let from, to;
      const now = new Date();
      if (currentRange === 'today') {
        from = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0);
        to   = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59);
      } else if (currentRange === '7d') {
        from = now;
        to = new Date(now.getTime() + 7*24*3600*1000);
      } else if (currentRange === 'month') {
        from = new Date(now.getFullYear(), now.getMonth(), 1, 0, 0, 0);
        to   = new Date(now.getFullYear(), now.getMonth()+1, 0, 23, 59, 59);
      } else {
        from = dataExtent.tMin;
        to   = dataExtent.tMax;
      }

      filtered = allPoints.filter(p => p.t >= from && p.t <= to);
      // Hvis filter gir tomt resultat (f.eks. i dag uten dekning), vis nærmeste 48 timer innenfor datasettet
      if (filtered.length === 0) {
        const center = now;
        const twoDays = 2*24*3600*1000;
        filtered = allPoints.filter(p => Math.abs(p.t - center) <= twoDays);
      }

      renderStats();
      renderTable();
      renderChart();
    }

    function renderStats() {
      if (!filtered.length) {
        $('#stat-min').textContent = '–';
        $('#stat-max').textContent = '–';
        $('#stat-avg').textContent = '–';
        $('#stat-info').textContent = 'Ingen punkter i valgt tidsrom.';
        return;
      }
      const vs = filtered.map(p => p.v);
      const vMin = Math.min(...vs);
      const vMax = Math.max(...vs);
      const avg = vs.reduce((a, b) => a + b, 0) / vs.length;

      $('#stat-min').textContent = fmtNum(vMin) + ' m';
      $('#stat-max').textContent = fmtNum(vMax) + ' m';
      $('#stat-avg').textContent = fmtNum(avg) + ' m';

      const from = filtered[0].t;
      const to = filtered[filtered.length-1].t;
      $('#stat-info').textContent = `Punkter: ${filtered.length} • Periode: ${fmtDate(from)} – ${fmtDate(to)}`;
    }

    function renderTable() {
      const tbody = $('#table-body');
      if (!filtered.length) {
        tbody.innerHTML = `<tr><td colspan="3" class="muted">Ingen data innen valgt periode.</td></tr>`;
        return;
      }
      const rows = filtered.slice(0, 2000).map(p => {
        const t = fmtDateTime(p.t);
        const v = fmtNum(p.v) + ' m';
        const type = p.type === 'H' ? 'Høyvann' : p.type === 'L' ? 'Lavvann' : (p.type === 'pred' ? '' : p.type);
        return `<tr><td class="nowrap">${t}</td><td>${v}</td><td class="muted">${type || ''}</td></tr>`;
      });
      tbody.innerHTML = rows.join('');
    }

    function renderChart() {
      const canvas = $('#chart');
      const wrap = $('#chart-wrap');
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      const w = wrap.clientWidth;
      const h = wrap.clientHeight;
      if (w === 0 || h === 0) return;

      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';

      const ctx = canvas.getContext('2d');
      ctx.scale(dpr, dpr);

      // Bakgrunn
      ctx.clearRect(0,0,w,h);

      // Hvis ingen data
      if (!filtered.length) {
        ctx.fillStyle = getCSS('--muted');
        ctx.font = '14px system-ui, -apple-system, Segoe UI, Roboto, Arial';
        ctx.fillText('Ingen data å vise', 10, 20);
        return;
      }

      // Skalaer
      const tMin = filtered[0].t.getTime();
      const tMax = filtered[filtered.length-1].t.getTime();
      let vMin = Math.min(...filtered.map(p => p.v));
      let vMax = Math.max(...filtered.map(p => p.v));
      if (vMax === vMin) { vMax += 0.5; vMin -= 0.5; }

      const padL = 46, padR = 12, padT = 16, padB = 26;
      const plotW = w - padL - padR;
      const plotH = h - padT - padB;

      // Rutenett
      ctx.strokeStyle = getCSS('--grid');
      ctx.lineWidth = 1;

      // Y-aksen ticks (5)
      const yTicks = niceTicks(vMin, vMax, 5);
      ctx.beginPath();
      for (const yv of yTicks) {
        const y = padT + plotH - (yv - vMin) / (vMax - vMin) * plotH;
        ctx.moveTo(padL, Math.round(y)+0.5);
        ctx.lineTo(w - padR, Math.round(y)+0.5);
      }
      ctx.stroke();

      // X-aksen ticks (time/dager)
      const xTicks = timeTicks(new Date(tMin), new Date(tMax), plotW);
      ctx.beginPath();
      for (const xt of xTicks) {
        const x = padL + (xt.getTime() - tMin) / (tMax - tMin) * plotW;
        ctx.moveTo(Math.round(x)+0.5, padT);
        ctx.lineTo(Math.round(x)+0.5, h - padB);
      }
      ctx.stroke();

      // Akselabels
      ctx.fillStyle = getCSS('--muted');
      ctx.font = '12px system-ui, -apple-system, Segoe UI, Roboto, Arial';
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      for (const yv of yTicks) {
        const y = padT + plotH - (yv - vMin) / (vMax - vMin) * plotH;
        ctx.fillText(fmtNum(yv), padL - 6, y);
      }

      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      for (const xt of xTicks) {
        const x = padL + (xt.getTime() - tMin) / (tMax - tMin) * plotW;
        ctx.fillText(fmtTickDate(xt, tMin, tMax), x, h - padB + 6);
      }

      // Kurve
      ctx.strokeStyle = getCSS('--accent');
      ctx.lineWidth = 2;
      ctx.beginPath();
      filtered.forEach((p, i) => {
        const x = padL + (p.t.getTime() - tMin) / (tMax - tMin) * plotW;
        const y = padT + plotH - (p.v - vMin) / (vMax - vMin) * plotH;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.stroke();

      // Markér H/L hvis finnes
      const hasHL = filtered.some(p => p.type === 'H' || p.type === 'L');
      if (hasHL) {
        for (const p of filtered) {
          if (p.type !== 'H' && p.type !== 'L') continue;
          const x = padL + (p.t.getTime() - tMin) / (tMax - tMin) * plotW;
          const y = padT + plotH - (p.v - vMin) / (vMax - vMin) * plotH;
          ctx.fillStyle = p.type === 'H' ? getCSS('--good') : getCSS('--bad');
          ctx.beginPath();
          ctx.arc(x, y, 3, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    // Utils
    function fmtNum(n) { return (Math.round(n * 100) / 100).toLocaleString('nb-NO', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
    function fmtDate(d) { return d.toLocaleDateString('nb-NO'); }
    function fmtDateTime(d) {
      return d.toLocaleString('nb-NO', {
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit'
      }).replace(',', '');
    }
    function fmtTickDate(d, tMin, tMax) {
      const spanDays = (tMax - tMin) / (1000*3600*24);
      if (spanDays <= 2) return d.toLocaleTimeString('nb-NO', { hour: '2-digit' });
      return d.toLocaleDateString('nb-NO', { day: '2-digit', month: '2-digit' });
    }
    function getCSS(varName) { return getComputedStyle(document.documentElement).getPropertyValue(varName).trim(); }
    function debounce(fn, ms) {
      let t; return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
    }
    function niceTicks(min, max, count=5) {
      const span = max - min;
      if (span === 0) return [min];
      const step = Math.pow(10, Math.floor(Math.log10(span / count)));
      const err = (count * step) / span;
      let niceStep = step;
      if (err <= 0.15) niceStep = step * 10;
      else if (err <= 0.35) niceStep = step * 5;
      else if (err <= 0.75) niceStep = step * 2;
      const ticks = [];
      const start = Math.ceil(min / niceStep) * niceStep;
      for (let v = start; v <= max; v += niceStep) ticks.push(+v.toFixed(6));
      return ticks;
    }
    function timeTicks(d0, d1, widthPx) {
      const ms = d1 - d0;
      const approxLabels = Math.max(3, Math.floor(widthPx / 110));
      const targetStep = ms / approxLabels;

      const steps = [
        5*60*1000, 10*60*1000, 15*60*1000, 30*60*1000,
        60*60*1000, 2*60*60*1000, 3*60*60*1000, 6*60*60*1000, 12*60*60*1000,
        24*60*60*1000, 2*24*60*60*1000, 3*24*60*60*1000, 7*24*60*60*1000
      ];
      let step = steps[0];
      for (const s of steps) { if (s >= targetStep) { step = s; break; } }
      const ticks = [];
      const start = alignTime(d0, step);
      for (let t = +start; t <= +d1 + 1; t += step) ticks.push(new Date(t));
      return ticks;
    }
    function alignTime(d, stepMs) {
      const t = +d;
      if (stepMs >= 24*3600*1000) {
        const dd = new Date(d.getFullYear(), d.getMonth(), d.getDate());
        return dd;
      }
      return new Date(Math.floor(t / stepMs) * stepMs);
    }
  </script>
</body>
</html>

<!DOCTYPE html><html lang="nb">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>Tidevann i Bergen</title>
  <base href="/Tidevanns/">
  <meta name="description" content="Tidevannsgraf med data fra Kartverket. Dag/natt-bakgrunn med sol/måne, intervallvalg, nå-linje og mørkt tema." />
  <link rel="canonical" href="https://skyrre.github.io/Tidevanns/" />
  <meta name="theme-color" content="#0d1117" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-title" content="Tidevann i Bergen">
  <link rel="apple-touch-icon" sizes="180x180" href="/Tidevanns/icons/apple-touch-icon-180.png?v=8">
  <link rel="icon" type="image/png" sizes="32x32" href="/Tidevanns/icons/favicon-32.png?v=8">
  <link rel="icon" type="image/png" sizes="16x16" href="/Tidevanns/icons/favicon-16.png?v=8">
  <link rel="manifest" href="/Tidevanns/site.webmanifest?v=8">
  <style>
    html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; background: #0d1117; }
    .tv-root {
      --bg: #0d1117; --fg: #c9d1d9; --muted: #8b949e; --accent: #58a6ff;
      --grid: #1f242d; --card: #0f141a; --border: #30363d;
      --sea-top: #3b8fc7; --sea-bottom: #0b2f49;
      --shadow: 0 6px 24px rgba(0,0,0,0.35);
      color-scheme: dark; background: var(--bg); color: var(--fg);
      min-height: 100dvh; height: 100dvh;
      padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);
      display: flex; flex-direction: column;
      font-family: system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,"Apple Color Emoji","Segoe UI Emoji";
      line-height: 1.45;
    }
    .tv-container { width: min(1100px, 100%); margin: 0 auto; padding: 12px 16px; }
    .tv-header { padding-top: 8px; }
    .tv-h1 { font-size: 1.5rem; margin: 0 0 6px; }
    .tv-sub { color: var(--muted); font-size: .95rem; margin-bottom: 10px; }.tv-controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; margin: 8px 0 10px; }
.tv-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: center; }

.tv-btn {
  appearance: none; border: 1px solid var(--border); background: #161b22; color: var(--fg);
  padding: 8px 12px; border-radius: 10px; cursor: pointer; font-weight: 600; box-shadow: var(--shadow);
  transition: border-color .15s, background-color .15s, color .15s;
}
.tv-btn:hover { border-color: #3a434d; background: #19202a; }
.tv-btn[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(88,166,255,0.18), var(--shadow); }

.tv-main { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.tv-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow: clip; box-shadow: var(--shadow);
  display: flex; flex-direction: column; min-height: 0; }
.tv-card h2 { font-size: 1rem; margin: 0; padding: 10px 14px; border-bottom: 1px solid var(--border); }
.tv-pad { flex: 1; display: flex; flex-direction: column; min-height: 0; padding: 10px 12px; }

.tv-chart-wrap { position: relative; width: 100%; min-height: 240px; }
.tv-chart { width: 100%; height: 100%; display: block; }

.tv-legend { display: flex; gap: 14px; align-items: center; color: var(--muted); font-size: .9rem; margin-top: 6px; justify-content: center; }
.tv-swatch { width: 18px; height: 4px; border-radius: 3px; background: var(--accent); display: inline-block; vertical-align: middle; margin-right: 6px; }

.tv-muted { color: var(--muted); }
.tv-stat-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; margin-top: 6px; }
.tv-stat { background: var(--card); border: 1px dashed var(--border); border-radius: 10px; padding: 8px; }
.tv-label { color: var(--muted); font-size: .85rem; }
.tv-val { font-weight: 700; font-size: 1.05rem; }

@media (max-width: 480px), (max-height: 700px) {
  .tv-sub { display: none; }
  .tv-stat-grid { display: none; }
  .tv-card h2 { display: none; }
  .tv-container { padding: 8px 10px; }
  .tv-pad { padding: 8px; }
}
@media (max-height: 640px) { .tv-footer { display: none; } }
.tv-footer { padding: 10px 16px 16px; color: var(--muted); text-align: center; font-size: .9rem; }
  </style>
</head>
<body>
  <div class="tv-root">
    <header class="tv-container tv-header">
      <h1 class="tv-h1" id="title">Tidevann i Bergen</h1>
      <div class="tv-sub" id="subtitle">Data fra Kartverket. Dra i grafen eller bruk piltaster for å bla.</div>
      <div class="tv-controls">
        <div class="tv-row" role="group" aria-label="Tidsvalg">
          <button class="tv-btn" data-range="1d" aria-pressed="true">24 t</button>
          <button class="tv-btn" data-range="3d">3 døgn</button>
          <button class="tv-btn" data-range="7d">7 døgn</button>
        </div>
      </div>
    </header><main class="tv-container tv-main">
  <section class="tv-card">
    <h2>Graf</h2>
    <div class="tv-pad">
      <div class="tv-chart-wrap" id="chart-wrap">
        <canvas class="tv-chart" id="chart" aria-label="Tidevannsgraf"></canvas>
      </div>
      <div class="tv-legend">
        <span><span class="tv-swatch"></span>Vannstand (m)</span>
      </div>
      <div class="tv-stat-grid">
        <div class="tv-stat"><div class="tv-label">Minimum (visning)</div><div class="tv-val" id="stat-min">–</div></div>
        <div class="tv-stat"><div class="tv-label">Maksimum (visning)</div><div class="tv-val" id="stat-max">–</div></div>
        <div class="tv-stat"><div class="tv-label">Snitt (visning)</div><div class="tv-val" id="stat-avg">–</div></div>
      </div>
      <div class="tv-muted" style="margin-top:6px" id="stat-info">–</div>
    </div>
  </section>
</main>

<footer class="tv-footer">
  Tid vises i din lokale tidssone (<span id="tz"></span>). Legg til på hjem-skjermen for app-opplevelse.
</footer>
  </div>  <script>
    // Konfig
    const XML_URLS = ['Tidevann.xml', 'https://skyrre.github.io/Tidevanns/Tidevann.xml'];
    const FIXED_Y_MIN = 0.0, FIXED_Y_MAX = 1.8; // fast høydeakse

    // Tilstand
    let allPoints = [];
    let dataExtent = null; // { tMin, tMax, vMin, vMax }
    let viewFrom = null, viewTo = null;
    let viewLenMs = 24 * 3600e3; // 24 t
    let currentRangeKey = '1d';
    const PAGE_LOAD_TS = Date.now();
    let SITE = { name: 'Bergen', code: '', ref: '', lat: 60.3913, lon: 5.3221 };

    // Dom utils
    const $ = (s) => document.querySelector(s);
    const $$ = (s) => Array.from(document.querySelectorAll(s));

    document.addEventListener('DOMContentLoaded', () => {
      $('#tz').textContent = Intl.DateTimeFormat().resolvedOptions().timeZone || 'lokal tid';

      // Tidsvalg
      $$('.tv-btn[data-range]').forEach(btn => {
        btn.addEventListener('click', () => {
          $$('.tv-btn[data-range]').forEach(b => b.setAttribute('aria-pressed', 'false'));
          btn.setAttribute('aria-pressed', 'true');
          currentRangeKey = btn.dataset.range;
          viewLenMs = rangeToMs(currentRangeKey);
          placeWindowAroundNow();
          renderAll();
        });
      });

      // Piltaster
      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') { panBy(-0.5); e.preventDefault(); }
        else if (e.key === 'ArrowRight') { panBy(0.5); e.preventDefault(); }
      });

      setupDragPan();

      layoutHeights();
      window.addEventListener('resize', debounce(() => { layoutHeights(); renderChart(); }, 80));
      window.addEventListener('orientationchange', () => setTimeout(() => { layoutHeights(); renderChart(); }, 100));

      loadXml();
    });

    function layoutHeights() {
      const vh = Math.max(window.innerHeight || 600, 400);
      const target = Math.max(260, Math.min(560, Math.round(vh * 0.55)));
      const wrap = $('#chart-wrap');
      if (wrap) wrap.style.height = target + 'px';
    }

    async function loadXml() {
      try {
        const { text } = await fetchFirstWorking(XML_URLS);
        const cleanText = sanitizeXmlText(text);
        const doc = new DOMParser().parseFromString(cleanText, 'application/xml');
        if (doc.querySelector('parsererror')) throw new Error('Ugyldig XML');

        const parsed = parseSehavnivaXml(doc);
        allPoints = parsed.points;
        SITE = { ...SITE, ...parsed.meta };
        if (!allPoints.length) throw new Error('Fant ingen waterlevel-punkter i XML');

        if (SITE.name) {
          const titleTxt = `Tidevann i ${SITE.name}`;
          document.title = titleTxt;
          $('#title').textContent = titleTxt;
          $$('#subtitle').textContent = `Data fra Kartverket (enhet: meter, ref: $${SITE.ref || '—'})`;
        }

        const tMin = allPoints[0].t;
        const tMax = allPoints[allPoints.length - 1].t;
        const vs = allPoints.map(p => p.v).filter(Number.isFinite);
        const vMin = Math.min(...vs);
        const vMax = Math.max(...vs);
        dataExtent = { tMin, tMax, vMin, vMax };

        viewLenMs = rangeToMs(currentRangeKey);
        placeWindowAroundNow();

        renderAll();
      } catch (err) {
        console.error(err);
        $$('#subtitle').textContent = `Feil ved lesing av data: $${err.message}`;
      }
    }

    function rangeToMs(key) {
      if (key === '1d') return 24 * 3600e3;
      if (key === '3d') return 3 * 24 * 3600e3;
      if (key === '7d') return 7 * 24 * 3600e3;
      return 24 * 3600e3;
    }

    function placeWindowAroundNow() {
      if (!dataExtent) return;
      let start = PAGE_LOAD_TS, end = start + viewLenMs;
      const min = dataExtent.tMin.getTime(), max = dataExtent.tMax.getTime();
      if (end > max) { end = max; start = Math.max(min, end - viewLenMs); }
      if (start < min) { start = min; end = Math.min(max, start + viewLenMs); }
      viewFrom = new Date(start); viewTo = new Date(end);
    }

    function panBy(fraction) {
      const span = viewTo - viewFrom;
      let s = viewFrom.getTime() + span * fraction;
      let e = viewTo.getTime() + span * fraction;
      const min = dataExtent.tMin.getTime(), max = dataExtent.tMax.getTime();
      if (s < min) { e += (min - s); s = min; }
      if (end > max) { s -= (end - max); e = max; }
      viewFrom = new Date(s); viewTo = new Date(e);
      renderAll();
    }

    function setupDragPan() {
      const canvas = $('#chart');
      const wrap = $('#chart-wrap');
      let dragging = false, dragStartX = 0, startFrom = 0, startTo = 0;

      function getPlotW() {
        const pad = { L: 56, R: 16 };
        return { pad, plotW: wrap.clientWidth - pad.L - pad.R };
      }

      canvas.addEventListener('pointerdown', (e) => {
        dragging = true;
        dragStartX = e.clientX;
        startFrom = viewFrom.getTime();
        startTo = viewTo.getTime();
        canvas.setPointerCapture?.(e.pointerId || 1);
      });

      window.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        const { plotW } = getPlotW();
        const span = startTo - startFrom;
        const dt = -(e.clientX - dragStartX) / plotW * span;
        const min = dataExtent.tMin.getTime(), max = dataExtent.tMax.getTime();
        let s = startFrom + dt, end = startTo + dt;
        if (s < min) { end += (min - s); s = min; }
        if (end > max) { s -= (end - max); end = max; }
        viewFrom = new Date(s); viewTo = new Date(end);
        renderAll();
      });

      window.addEventListener('pointerup', (e) => {
        dragging = false;
        canvas.releasePointerCapture?.(e.pointerId || 1);
      });
      canvas.addEventListener('pointerleave', () => { dragging = false; });
    }

    function renderAll() {
      renderStats();
      renderChart();
    }

    function filteredInView() {
      if (!dataExtent) return [];
      const from = viewFrom.getTime(), to = viewTo.getTime();
      const lo = lowerBound(allPoints, from);
      const hi = upperBound(allPoints, to);
      return allPoints.slice(Math.max(0, lo - 1), Math.min(allPoints.length, hi + 1));
    }

    function renderStats() {
      const pts = filteredInView();
      if (!pts.length) {
        $('#stat-min').textContent = '–';
        $('#stat-max').textContent = '–';
        $('#stat-avg').textContent = '–';
        $('#stat-info').textContent = 'Ingen punkter i visningen.';
        return;
      }
      const vs = pts.map(p => p.v);
      const vMin = Math.min(...vs), vMax = Math.max(...vs);
      const avg = vs.reduce((a,b) => a + b, 0) / vs.length;
      $('#stat-min').textContent = `${fmtNum(vMin)} m`;
      $('#stat-max').textContent = `${fmtNum(vMax)} m`;
      $('#stat-avg').textContent = `${fmtNum(avg)} m`;
      $$('#stat-info').textContent = `Viser $${fmtDateTime(viewFrom)} → ${fmtDateTime(viewTo)} • Punkter: ${pts.length}`;
    }

    function renderChart() {
      const wrap = $('#chart-wrap');
      const canvas = $('#chart');
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      const w = wrap.clientWidth, h = wrap.clientHeight;
      if (w === 0 || h === 0) return;

      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
      const ctx = canvas.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, w, h);

      const pad = { L: 56, R: 16, T: 20, B: 32 };
      const plotW = w - pad.L - pad.R, plotH = h - pad.T - pad.B;

      const pts = filteredInView();
      if (!pts.length) {
        ctx.fillStyle = getCSS('--muted');
        ctx.font = '14px system-ui,-apple-system,Segoe UI,Roboto,Arial';
        ctx.fillText('Ingen data i visningsvinduet', pad.L + 8, pad.T + 16);
        return;
      }

      const vMin = FIXED_Y_MIN, vMax = FIXED_Y_MAX;
      const tMin = viewFrom.getTime(), tMax = viewTo.getTime();

      const xOf = (t) => pad.L + (t - tMin) / (tMax - tMin) * plotW;
      const yRaw = (v) => pad.T + plotH - (v - vMin) / (vMax - vMin) * plotH;
      const yOf = (v) => clamp(yRaw(v), pad.T, pad.T + plotH);

      // Bakgrunn
      ctx.fillStyle = getCSS('--card'); ctx.fillRect(pad.L, pad.T, plotW, plotH);

      // Dag/natt-lag med sol/måne
      drawDaylightLayer(ctx, pad, plotW, plotH, tMin, tMax, SITE.lat, SITE.lon, xOf);

      // Kurve + fyll
      const path = new Path2D();
      pts.forEach((p, i) => { const x = xOf(p.t.getTime()), y = yOf(p.v); if (i===0) path.moveTo(x,y); else path.lineTo(x,y); });
      ctx.save();
      const under = new Path2D(path);
      under.lineTo(xOf(pts[pts.length - 1].t.getTime()), pad.T + plotH);
      under.lineTo(xOf(pts[0].t.getTime()), pad.T + plotH);
      under.closePath(); ctx.clip(under);
      const seaGrad = ctx.createLinearGradient(0, pad.T, 0, pad.T + plotH);
      seaGrad.addColorStop(0, getCSS('--sea-top')); seaGrad.addColorStop(1, getCSS('--sea-bottom'));
      ctx.fillStyle = seaGrad; ctx.fillRect(pad.L, pad.T, plotW, plotH);
      ctx.restore();

      // Y-grid + etiketter
      ctx.strokeStyle = getCSS('--grid'); ctx.lineWidth = 1;
      const yTicks = niceTicks(vMin, vMax, 6);
      ctx.beginPath(); for (const yv of yTicks) { const y = Math.round(yOf(yv)) + 0.5; ctx.moveTo(pad.L, y); ctx.lineTo(w - pad.R, y); } ctx.stroke();
      ctx.fillStyle = getCSS('--muted'); ctx.font = '12px system-ui,-apple-system,Segoe UI,Roboto,Arial';
      ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; for (const yv of yTicks) ctx.fillText(fmtNum(yv), pad.L - 8, yOf(yv));

      // X-akse: datoer
      const days = dayTicks(new Date(tMin), new Date(tMax)).filter(d => d.getTime() >= tMin && d.getTime() <= tMax);
      if (days.length === 0) days.push(startOfDay(new Date(tMin)));
      ctx.beginPath(); for (const d of days) { const x = Math.round(xOf(d.getTime())) + 0.5; ctx.moveTo(x, pad.T); ctx.lineTo(x, h - pad.B); } ctx.stroke();
      ctx.textAlign = 'center'; ctx.textBaseline = 'top'; for (const d of days) ctx.fillText(fmtTickDateShort(d), xOf(d.getTime()), h - pad.B + 6);

      // Nullinje (0 m)
      if (0 >= vMin && 0 <= vMax) {
        ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.setLineDash([4,4]);
        ctx.beginPath(); const y0 = yOf(0); ctx.moveTo(pad.L, y0); ctx.lineTo(w - pad.R, y0); ctx.stroke(); ctx.setLineDash([]);
      }

      // Kurve
      ctx.strokeStyle = getCSS('--accent'); ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      ctx.beginPath(); pts.forEach((p,i)=>{const x=xOf(p.t.getTime()), y=yOf(p.v); if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);}); ctx.stroke();

      // Nå-linje + label
      if (PAGE_LOAD_TS >= tMin && PAGE_LOAD_TS <= tMax) {
        const xNow = xOf(PAGE_LOAD_TS);
        ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 1.5; ctx.setLineDash([6,4]);
        ctx.beginPath(); ctx.moveTo(Math.round(xNow)+0.5, pad.T); ctx.lineTo(Math.round(xNow)+0.5, pad.T+plotH); ctx.stroke();
        ctx.setLineDash([]);
        drawLabel(ctx, Math.min(xNow+8, w - pad.R - 60), pad.T + 6, 'Nå');
      }

      // Venstre akselabel (verdi ved starttidspunktet)
      const vAxis = interpolateAtTime(viewFrom.getTime(), pts);
      if (Number.isFinite(vAxis)) {
        let y = yOf(vAxis);
        y = Math.min(pad.T + plotH - 12, Math.max(pad.T + 12, y));
        ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(pad.L - 4, y); ctx.lineTo(pad.L + 4, y); ctx.stroke();
        const valueLabel = (Math.round(vAxis * 10) / 10).toLocaleString('nb-NO', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
        const timeLabel = new Date(viewFrom).toLocaleTimeString('nb-NO', { hour: '2-digit', minute: '2-digit' });
        drawLabel(ctx, pad.L + 8, y - 10, `${valueLabel} m • ${timeLabel}`);
      }
    }

    // Dag/natt-lag med sol/måne (lysere dagslys)
    function drawDaylightLayer(ctx, pad, plotW, plotH, tMin, tMax, lat, lon, xOf) {
      const topY = pad.T, bottomY = pad.T + plotH;
      let day = startOfDay(new Date(tMin));
      const endDay = startOfDay(new Date(tMax + 24*3600e3));

      function fillDay(xs, xe) {
        xs = Math.max(xs, pad.L); xe = Math.min(xe, pad.L + plotW); if (xe <= xs) return;
        const grad = ctx.createLinearGradient(xs, 0, xe, 0);
        grad.addColorStop(0.00, 'rgba(255,255,255,0.10)');
        grad.addColorStop(0.50, 'rgba(255,255,255,0.18)');
        grad.addColorStop(1.00, 'rgba(255,255,255,0.10)');
        ctx.fillStyle = grad; ctx.fillRect(xs, topY, xe - xs, bottomY - topY);
      }

      while (day <= endDay) {
        const sun = getSunTimes(day, lat, lon);
        const dayStart = day.getTime(), dayEnd = dayStart + 24*3600e3;

        if (sun.alwaysDay) {
          const xs = xOf(Math.max(dayStart, tMin)), xe = xOf(Math.min(dayEnd, tMax));
          fillDay(xs, xe);
          const xNoon = xOf(sun.solarNoon.getTime()); if (xNoon >= pad.L && xNoon <= pad.L + plotW) drawSun(ctx, xNoon, topY + 16, 7);
        } else if (sun.alwaysNight) {
          const mid = dayStart + 12*3600e3, xMoon = xOf(mid);
          if (xMoon >= pad.L && xMoon <= pad.L + plotW) {
            const mp = moonPhaseFrac(new Date(mid));
            drawMoon(ctx, xMoon, topY + 16, 7, mp.phase, mp.illum, mp.waxing);
          }
        } else if (sun.sunrise && sun.sunset) {
          const sr = sun.sunrise.getTime(), ss = sun.sunset.getTime();
          const xs = xOf(Math.max(Math.max(sr, tMin), dayStart));
          const xe = xOf(Math.min(Math.min(ss, tMax), dayEnd));
          fillDay(xs, xe);

          const xNoon = xOf(sun.solarNoon.getTime());
          if (xNoon >= pad.L && xNoon <= pad.L + plotW) drawSun(ctx, xNoon, topY + 16, 7);

          // Måne omtrent midt på natten (mellom dagens solnedgang og neste dags soloppgang)
          const next = new Date(day.getFullYear(), day.getMonth(), day.getDate() + 1);
          const sunNext = getSunTimes(next, lat, lon);
          let nightStart = ss, nightEnd = sunNext.sunrise ? sunNext.sunrise.getTime() : (dayEnd + 6*3600e3);
          const mid = nightStart + (nightEnd - nightStart) / 2;
          if (mid >= tMin && mid <= tMax) {
            const xMoon = xOf(mid);
            if (xMoon >= pad.L && xMoon <= pad.L + plotW) {
              const mp = moonPhaseFrac(new Date(mid));
              drawMoon(ctx, xMoon, topY + 16, 7, mp.phase, mp.illum, mp.waxing);
            }
          }
        }

        day = new Date(day.getFullYear(), day.getMonth(), day.getDate() + 1);
      }
    }

    // Soltider (NOAA-approx) – gir Date i lokal tid
    function getSunTimes(day, lat, lon) {
      // Dagnummer
      const N = dayOfYear(day);
      const gamma = 2 * Math.PI / 365 * (N - 1);
      // Ekv. for tid (min) og deklinasjon (rad)
      const E = 229.18 * (0.000075 + 0.001868 * Math.cos(gamma) - 0.032077 * Math.sin(gamma)
        - 0.014615 * Math.cos(2 * gamma) - 0.040849 * Math.sin(2 * gamma));
      const dec = 0.006918 - 0.399912 * Math.cos(gamma) + 0.070257 * Math.sin(gamma)
        - 0.006758 * Math.cos(2 * gamma) + 0.000907 * Math.sin(2 * gamma)
        - 0.002697 * Math.cos(3 * gamma) + 0.00148 * Math.sin(3 * gamma);

      const phi = rad(lat);
      const cosZ = Math.cos(rad(90.833)); // solhøyde -0.833°
      const cosH0 = (cosZ - Math.sin(phi) * Math.sin(dec)) / (Math.cos(phi) * Math.cos(dec));

      const utcMidnight = Date.UTC(day.getFullYear(), day.getMonth(), day.getDate());
      const solarNoonMinUTC = 720 - 4 * lon - E;

      if (cosH0 < -1) {
        // Alltid dag (midnattssol)
        return {
          sunrise: null, sunset: null,
          solarNoon: new Date(utcMidnight + solarNoonMinUTC * 60 * 1000),
          alwaysDay: true, alwaysNight: false
        };
      }
      if (cosH0 > 1) {
        // Alltid natt (polarnatt)
        return {
          sunrise: null, sunset: null,
          solarNoon: new Date(utcMidnight + solarNoonMinUTC * 60 * 1000),
          alwaysDay: false, alwaysNight: true
        };
      }

      const H0deg = Math.degrees ? Math.degrees(Math.acos(cosH0)) : (Math.acos(cosH0) * 180 / Math.PI);
      const deltaMin = 4 * H0deg;
      const sunriseUTC = solarNoonMinUTC - deltaMin;
      const sunsetUTC = solarNoonMinUTC + deltaMin;

      return {
        sunrise: new Date(utcMidnight + sunriseUTC * 60 * 1000),
        sunset: new Date(utcMidnight + sunsetUTC * 60 * 1000),
        solarNoon: new Date(utcMidnight + solarNoonMinUTC * 60 * 1000),
        alwaysDay: false, alwaysNight: false
      };
    }

    // Små ikoner
    function drawSun(ctx, x, y, r) {
      ctx.save();
      ctx.lineWidth = 1.25; ctx.strokeStyle = 'rgba(255,220,120,0.9)'; ctx.fillStyle = 'rgba(255,220,120,0.25)';
      const rays = 8;
      for (let i=0;i<rays;i++){
        const a=(i/rays)*Math.PI*2, x1=x+Math.cos(a)*(r+2), y1=y+Math.sin(a)*(r+2), x2=x+Math.cos(a)*(r+5), y2=y+Math.sin(a)*(r+5);
        ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
      }
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill(); ctx.stroke(); ctx.restore();
    }
    function drawMoon(ctx, x, y, r, phase, illum, waxing){
      ctx.save();
      const body='#d9dde6', shadow='#0f141a';
      ctx.fillStyle=body; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
      const s=(1-2*illum)*r; // enkel terminator
      ctx.fillStyle=shadow; ctx.beginPath(); ctx.arc(x+(waxing?-s:s),y,r,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,0.25)'; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.stroke();
      ctx.restore();
    }

    // Label
    function drawLabel(ctx, x, y, text) {
      const padX = 6, padY = 4;
      ctx.font = '12px system-ui,-apple-system,Segoe UI,Roboto,Arial';
      const m = ctx.measureText(text);
      const w = Math.ceil(m.width) + padX * 2;
      const h = 18;
      ctx.fillStyle = 'rgba(13,17,23,0.97)';
      ctx.strokeStyle = 'rgba(255,255,255,0.08)';
      ctx.lineWidth = 1;
      if (ctx.roundRect) {
        ctx.beginPath(); ctx.roundRect(x, y, w, h, 6); ctx.fill(); ctx.stroke();
      } else {
        ctx.fillRect(x, y, w, h); ctx.strokeRect(x, y, w, h);
      }
      ctx.fillStyle = '#c9d1d9';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      ctx.fillText(text, x + padX, y + padY - 1);
    }

    // Akselabel/format
    function startOfDay(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
    function dayTicks(d0,d1){ const res=[]; let t=startOfDay(d0); while(t<=d1){ res.push(new Date(t)); t=new Date(t.getFullYear(),t.getMonth(),t.getDate()+1);} return res; }
    function fmtNum(n){ return (Math.round(n*100)/100).toLocaleString('nb-NO',{minimumFractionDigits:2,maximumFractionDigits:2}); }
    function fmtDateTime(d){ return d.toLocaleString('nb-NO',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).replace(',', ''); }
    function fmtTickDateShort(d){ const s=d.toLocaleDateString('nb-NO',{day:'numeric',month:'short'}); return s.replaceAll('.','').trim(); }
    function getCSS(v){ return getComputedStyle(document.querySelector('.tv-root')).getPropertyValue(v).trim(); }
    function debounce(fn,ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a),ms); }; }
    function clamp(x,a,b){ return Math.min(b, Math.max(a, x)); }
    function niceTicks(min,max,count=5){
      const span=max-min; if(span===0) return [min];
      const step=Math.pow(10,Math.floor(Math.log10(span/count)));
      const err=(count*step)/span; let nice=step;
      if(err<=0.15) nice=step*10; else if(err<=0.35) nice=step*5; else if(err<=0.75) nice=step*2;
      const ticks=[]; const start=Math.ceil(min/nice)*nice;
      for(let v=start; v<=max+1e-9; v+=nice) ticks.push(+v.toFixed(6));
      return ticks;
    }
    function lowerBound(arr,t){ let l=0,r=arr.length; while(l<r){ const m=(l+r)>>1; (arr[m].t.getTime()<t) ? l=m+1 : r=m; } return l; }
    function upperBound(arr,t){ let l=0,r=arr.length; while(l<r){ const m=(l+r)>>1; (arr[m].t.getTime()<=t) ? l=m+1 : r=m; } return l; }
    function interpolateAtTime(t, pts){
      if(!pts || pts.length===0) return NaN;
      let i = lowerBound(pts, t);
      if (i <= 0) return pts[0].v;
      if (i >= pts.length) return pts[pts.length - 1].v;
      const p0 = pts[i-1], p1 = pts[i];
      const t0 = p0.t.getTime(), t1 = p1.t.getTime();
      if (t1 === t0) return p0.v;
      const f = (t - t0) / (t1 - t0);
      return p0.v + (p1.v - p0.v) * f;
    }

    // Hjelpere for sol/måne
    function dayOfYear(d){ const start=new Date(d.getFullYear(),0,1); const diff = (startOfDay(d)-startOfDay(start))/86400000; return diff+1; }
    function rad(d){ return d*Math.PI/180; }
    Math.degrees = Math.degrees || function(r){ return r*180/Math.PI; };
    function toJulian(date){ return date.getTime()/86400000 + 2440587.5; }
    function moonPhaseFrac(date){
      const SYN=29.53058867, JD0=2451550.1; // ref-nymåne ~2000-01-06
      const jd=toJulian(date), days=jd-JD0;
      let phase=(days%SYN)/SYN; if(phase<0) phase+=1;
      const illum=0.5*(1-Math.cos(2*Math.PI*phase));
      return { phase, illum, waxing: phase<0.5 };
    }

    // Henting
    async function fetchFirstWorking(urls){
      let lastErr=null;
      for(const u0 of urls){
        try{
          const u=addCacheBuster(u0);
          const res=await fetch(u,{ cache:'no-cache' });
          if(!res.ok){ lastErr=new Error(`HTTP ${res.status} for ${u}`); continue; }
          const txt=await res.text();
          if(!/\<(tide|waterlevel)\b/i.test(txt.slice(0,2000))) { lastErr=new Error(`Uventet innhold for ${u}`); continue; }
          return { text: txt, url: u };
        } catch(e){ lastErr=e; }
      }
      throw lastErr || new Error('Fant ingen gyldig Tidevann.xml');
    }
    function addCacheBuster(u){ try{ const url=new URL(u, location.href); url.searchParams.set('v', String(Date.now())); return url.toString(); }catch{ return u; } }
    function sanitizeXmlText(txt){ let s=txt.replace(/^\uFEFF/,''); const i=s.indexOf('<'); if(i>0) s=s.slice(i); const j=s.lastIndexOf('>'); if(j>=0) s=s.slice(0,j+1); return s; }

    // Parser
    function parseSehavnivaXml(doc){
      const points=[]; const loc=doc.querySelector('location');
      const meta={ name:loc?.getAttribute('name')||'Bergen', code:loc?.getAttribute('code')||'',
        ref:doc.querySelector('reflevelcode')?.textContent?.trim()||'',
        lat:parseFloat(loc?.getAttribute('latitude')||'')||60.3913,
        lon:parseFloat(loc?.getAttribute('longitude')||'')||5.3221 };
      const dataBlocks=[...doc.querySelectorAll('locationdata > data')];
      for(const dataEl of dataBlocks){
        const unit=(dataEl.getAttribute('unit')||'').toLowerCase();
        const type=(dataEl.getAttribute('type')||'').toLowerCase();
        for(const wl of dataEl.querySelectorAll('waterlevel')){
          const time=wl.getAttribute('time'); const valStr=wl.getAttribute('value'); if(!time||!valStr) continue;
          const t=new Date(time); if(isNaN(t)) continue;
          let v=parseFloat(valStr); if(!isFinite(v)) continue;
          const u=unit || findUnitAttr(wl);
          if(u==='cm') v/=100; else if(u==='dm') v/=10;
          const flag=(wl.getAttribute('flag')||'').toLowerCase();
          const src = flag==='obs' || type==='observation' ? 'obs' : (type||flag||'pred');
          points.push({ t, v, src });
        }
      }
      points.sort((a,b)=>a.t-b.t||a.v-b.v);
      const dedup=[]; const seen=new Set();
      for(const p of points){ const key=p.t.toISOString().slice(0,16); if(seen.has(key)) continue; seen.add(key); dedup.push(p); }
      return { points: dedup, meta };
    }
    function findUnitAttr(el){ let cur=el; for(let i=0;i<5 && cur;i++){ if(cur.getAttribute){ const u=cur.getAttribute('unit')||cur.getAttribute('units')||cur.getAttribute('enhet'); if(u) return u.toLowerCase(); } cur=cur.parentElement; } return ''; }
  </script></body>

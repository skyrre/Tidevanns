<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tidevann – Bergen (statisk)</title>

  <!-- GitHub Project Pages under /Tidevanns/ -->
  <base href="/Tidevanns/">

  <meta name="description" content="Statisk visning av tidevannsdata fra Tidevann.xml (robust mot BOM/encoding)" />
  <link rel="canonical" href="https://skyrre.github.io/Tidevanns/" />

  <style>
    :root { color-scheme: light dark; --bg:#0b0b0c; --fg:#e9eef3; --muted:#9aa6b2; --accent:#2f7dd1; --grid:#2a2f36; --card:#14181d; --border:#1f262d; --good:#2db071; --bad:#d9534f; }
    @media (prefers-color-scheme: light) { :root { --bg:#f7f8fa; --fg:#0f1720; --muted:#5c6773; --accent:#155eab; --grid:#e6ebf1; --card:#fff; --border:#dfe6ee; } }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;height:100%}
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,"Apple Color Emoji","Segoe UI Emoji";background:var(--bg);color:var(--fg);line-height:1.45}
    header,main{width:min(1100px,100%);margin:0 auto;padding:16px} header{padding-top:20px}
    h1{font-size:1.6rem;margin:0 0 6px} .sub{color:var(--muted);font-size:.95rem;margin-bottom:14px}
    .controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0 16px}
    button.btn{appearance:none;border:1px solid var(--border);background:var(--card);color:var(--fg);padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:600}
    button.btn[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in oklab,var(--accent) 12%,var(--card))}
    .info{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
    @media(min-width:900px){.info{grid-template-columns:2fr 1fr}}
    .card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:clip}
    .card h2{font-size:1rem;margin:0;padding:12px 14px;border-bottom:1px solid var(--border)} .pad{padding:12px}
    #chart-wrap{position:relative;width:100%;height:340px} #chart{width:100%;height:100%;display:block}
    .legend{display:flex;gap:14px;align-items:center;color:var(--muted);font-size:.9rem;margin-top:8px}
    .legend .swatch{width:14px;height:3px;border-radius:2px;background:var(--accent);display:inline-block;vertical-align:middle;margin-right:6px}
    table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
    thead th{text-align:left;font-size:.9rem;color:var(--muted);position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--border);padding:10px 8px}
    tbody td{padding:8px;border-bottom:1px dashed var(--border)} tbody tr:hover{background:color-mix(in oklab,var(--accent) 8%,var(--card))}
    .muted{color:var(--muted)} .stat-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
    .stat{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px}
    .stat .label{color:var(--muted);font-size:.85rem} .stat .val{font-weight:700;font-size:1.1rem}
    footer{padding:30px 16px 50px;color:var(--muted);text-align:center}
    .error{color:var(--bad);font-weight:600} .ok{color:var(--good);font-weight:600}
    .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center} .spacer{flex:1} .small{font-size:.9rem} .nowrap{white-space:nowrap}
    .debug{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;font-size:.85rem;white-space:pre-wrap;background:var(--card);border:1px dashed var(--border);border-radius:8px;padding:8px;margin-top:10px;color:var(--muted)}
  </style>
</head>
<body>
  <header>
    <h1 id="title">Tidevann – (statisk)</h1>
    <div class="sub" id="subtitle">Leser data fra Tidevann.xml i samme mappe (ingen API-kall).</div>

    <div class="controls">
      <div class="row">
        <button class="btn" data-range="today" aria-pressed="true">I dag</button>
        <button class="btn" data-range="7d">Neste 7 dager</button>
        <button class="btn" data-range="month">Denne måneden</button>
        <button class="btn" data-range="all">Alt</button>
      </div>
      <span class="spacer"></span>
      <div class="row small">
        <span id="dataset-meta" class="muted">Laster …</span>
      </div>
    </div>
  </header>

  <main class="info">
    <section class="card">
      <h2>Graf</h2>
      <div class="pad">
        <div id="chart-wrap"><canvas id="chart"></canvas></div>
        <div class="legend"><span class="swatch"></span>Vannstand (m)</div>
      </div>
    </section>
    <section class="card">
      <h2>Statistikk (filter)</h2>
      <div class="pad">
        <div class="stat-grid">
          <div class="stat"><div class="label">Minimum</div><div class="val" id="stat-min">–</div></div>
          <div class="stat"><div class="label">Maksimum</div><div class="val" id="stat-max">–</div></div>
          <div class="stat"><div class="label">Snitt</div><div class="val" id="stat-avg">–</div></div>
        </div>
        <div class="small muted" style="margin-top:8px" id="stat-info">–</div>
        <div id="debug" class="debug" style="display:none"></div>
      </div>
    </section>

    <section class="card" style="grid-column: 1 / -1;">
      <h2>Tabell</h2>
      <div class="pad" style="max-height: 50vh; overflow: auto;">
        <table>
          <thead><tr><th>Dato/tid</th><th>Høyde (m)</th><th>Kilde</th></tr></thead>
          <tbody id="table-body"><tr><td colspan="3" class="muted">Laster data …</td></tr></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer>
    Kilde: Tidevann.xml • Tid vises i din lokale tidssone (<span id="tz"></span>)
  </footer>

  <script>
    // Bruk både relativ og absolutt URL (samme origin)
    const XML_URLS = [
      'Tidevann.xml',
      'https://skyrre.github.io/Tidevanns/Tidevann.xml'
    ];

    let allPoints = [];   // {t: Date, v: number, src: 'obs'|'pred'|'H'|'L'|string}
    let filtered = [];
    let dataExtent = null;
    let currentRange = 'today';
    let lastFetchInfo = null;

    const $ = (sel) => document.querySelector(sel);
    const $$ = (sel) => Array.from(document.querySelectorAll(sel));

    document.addEventListener('DOMContentLoaded', () => {
      $('#tz').textContent = Intl.DateTimeFormat().resolvedOptions().timeZone || 'lokal tid';
      $$('.btn').forEach(btn => {
        btn.addEventListener('click', () => {
          $$('.btn').forEach(b => b.setAttribute('aria-pressed', 'false'));
          btn.setAttribute('aria-pressed', 'true');
          currentRange = btn.dataset.range;
          applyFilterAndRender();
        });
      });
      loadXml();
      window.addEventListener('resize', debounce(renderChart, 100));
    });

    async function loadXml() {
      try {
        const { text, url, status, contentType, encoding, previewHex } = await fetchFirstWorking(XML_URLS);
        lastFetchInfo = { url, status, contentType, encoding, previewHex };

        const cleanText = sanitizeXmlText(text);
        const doc = new DOMParser().parseFromString(cleanText, 'application/xml');
        if (doc.querySelector('parsererror')) throw new Error('Ugyldig XML (parsererror)');

        const parsed = parseSehavnivaXml(doc);
        allPoints = parsed.points;
        if (!allPoints.length) throw new Error('Fant ingen waterlevel-punkter i XML');

        if (parsed.meta.name) {
          $('#title').textContent = `Tidevann – ${parsed.meta.name} (statisk)`;
          $('#subtitle').textContent = `Lokal fil: Tidevann.xml • Enhet: meter • Ref: ${parsed.meta.ref || '—'}`;
        }

        const tMin = allPoints[0].t;
        const tMax = allPoints[allPoints.length - 1].t;
        const vs = allPoints.map(p => p.v).filter(Number.isFinite);
        const vMin = Math.min(...vs);
        const vMax = Math.max(...vs);
        dataExtent = { tMin, tMax, vMin, vMax };

        $('#dataset-meta').innerHTML = `Punkter: <span class="ok">${allPoints.length}</span> • Periode: ${fmtDate(tMin)} – ${fmtDate(tMax)} • Hentet fra: <code>${shortUrl(url)}</code> • Encoding: ${encoding}`;
        hideDebug();
        applyFilterAndRender();
      } catch (err) {
        console.error(err);
        const info = lastFetchInfo
          ? `URL: ${lastFetchInfo.url}
HTTP: ${lastFetchInfo.status}
Content-Type: ${lastFetchInfo.contentType}
Encoding: ${lastFetchInfo.encoding || '-'}
Første bytes (hex): ${lastFetchInfo.previewHex || '-'}`
          : 'Ingen fetch-info.';
        $('#dataset-meta').innerHTML = `<span class="error">Kunne ikke laste/lese Tidevann.xml: ${escapeHtml(err.message)}</span>`;
        $('#table-body').innerHTML = `<tr><td colspan="3" class="error">Feil ved lasting/parsing av Tidevann.xml.</td></tr>`;
        showDebug(info);
      }
    }

    async function fetchFirstWorking(urls) {
      let lastErr = null;
      for (const u0 of urls) {
        try {
          const u = addCacheBuster(u0);
          const res = await fetch(u, { cache: 'no-cache', mode: 'same-origin' });
          const { text, encoding, previewHex } = await decodeWithBom(res);
          lastFetchInfo = { url: u, status: res.status, contentType: res.headers.get('content-type') || '', encoding, previewHex };
          if (!res.ok) { lastErr = new Error(`HTTP ${res.status} for ${u}`); continue; }
          // Heuristikk: må inneholde <tide eller <waterlevel
          const preview = text.slice(0, 500);
          if (!/\<(tide|waterlevel)\b/i.test(preview)) {
            lastErr = new Error(`Uventet innhold (ikke tide-XML) for ${u}`);
            continue;
          }
          return { text, url: u, status: res.status, contentType: res.headers.get('content-type') || '', encoding, previewHex };
        } catch (e) {
          lastErr = e;
        }
      }
      throw lastErr || new Error('Fant ingen gyldig XML via kandidat-URLer');
    }

    // Dekoder respons med respekt for BOM (UTF-8/UTF-16 LE/BE)
    async function decodeWithBom(res) {
      const buf = await res.arrayBuffer();
      const bytes = new Uint8Array(buf);
      let enc = 'utf-8', offset = 0;
      if (bytes.length >= 3 && bytes[0] === 0xEF && bytes[1] === 0xBB && bytes[2] === 0xBF) {
        enc = 'utf-8'; offset = 3;
      } else if (bytes.length >= 2 && bytes[0] === 0xFF && bytes[1] === 0xFE) {
        enc = 'utf-16le'; offset = 2;
      } else if (bytes.length >= 2 && bytes[0] === 0xFE && bytes[1] === 0xFF) {
        enc = 'utf-16be'; offset = 2;
      }
      const decoder = new TextDecoder(enc);
      const text = decoder.decode(bytes.subarray(offset));
      const previewHex = bytesToHex(bytes.slice(0, 16));
      return { text, encoding: enc, previewHex };
    }

    function addCacheBuster(u) {
      try {
        const url = new URL(u, location.href);
        url.searchParams.set('v', String(Date.now()));
        return url.toString();
      } catch { return u; }
    }

    // Stripper BOM og alt før første '<', og søppel etter siste '>'
    function sanitizeXmlText(txt) {
      let s = txt.replace(/^\uFEFF/, '');
      const i = s.indexOf('<');
      if (i > 0) s = s.slice(i);
      const j = s.lastIndexOf('>');
      if (j >= 0) s = s.slice(0, j + 1);
      return s;
    }

    // Parser for Sehavniva-lignende XML
    // <tide><locationdata><data type="observation" unit="cm"><waterlevel value=".." time=".."/></data>...</locationdata></tide>
    function parseSehavnivaXml(doc) {
      const points = [];
      const meta = {
        name: doc.querySelector('location')?.getAttribute('name') || '',
        code: doc.querySelector('location')?.getAttribute('code') || '',
        lat: doc.querySelector('location')?.getAttribute('latitude') || '',
        lon: doc.querySelector('location')?.getAttribute('longitude') || '',
        ref: doc.querySelector('reflevelcode')?.textContent?.trim() || '',
      };

      const dataBlocks = Array.from(doc.querySelectorAll('locationdata > data'));
      for (const dataEl of dataBlocks) {
        const unit = (dataEl.getAttribute('unit') || '').toLowerCase(); // cm, m, dm
        const type = (dataEl.getAttribute('type') || '').toLowerCase(); // observation, prediction, ...
        const waterlevels = Array.from(dataEl.querySelectorAll('waterlevel'));
        for (const wl of waterlevels) {
          const time = wl.getAttribute('time');
          const valStr = wl.getAttribute('value');
          if (!time || !valStr) continue;

          const t = new Date(time); if (isNaN(t)) continue;
          let v = parseFloat(valStr); if (!isFinite(v)) continue;

          let u = unit || findUnitAttr(wl);
          if (u === 'cm') v = v / 100;
          else if (u === 'dm') v = v / 10;
          // ellers antar meter

          const flag = (wl.getAttribute('flag') || '').toLowerCase(); // 'obs' o.l.
          const src = flag === 'obs' || type === 'observation' ? 'obs' : (type || flag || 'pred');
          points.push({ t, v, src });
        }
      }

      // Ev. høy/lav (hvis tilstede)
      const extremes = Array.from(doc.querySelectorAll('highlow > extreme, extremes > extreme'));
      for (const ex of extremes) {
        const name = (ex.getAttribute('name') || '').toLowerCase();
        const time = ex.getAttribute('time');
        const valStr = ex.getAttribute('value');
        if (!time || !valStr) continue;
        const t = new Date(time); if (isNaN(t)) continue;
        let v = parseFloat(valStr); if (!isFinite(v)) continue;
        const u = (findUnitAttr(ex) || '').toLowerCase();
        if (u === 'cm') v = v / 100;
        else if (u === 'dm') v = v / 10;
        const src = name.startsWith('high') ? 'H' : name.startsWith('low') ? 'L' : 'ext';
        points.push({ t, v, src });
      }

      points.sort((a, b) => a.t - b.t || a.v - b.v);

      // Dedup per minutt for kontinuerlige punkter, men bevar H/L
      const dedup = [];
      const seenMin = new Set();
      for (const p of points) {
        const key = p.t.toISOString().slice(0,16);
        const isHL = p.src === 'H' || p.src === 'L';
        if (!isHL) {
          if (seenMin.has(key)) continue;
          seenMin.add(key);
        }
        dedup.push(p);
      }
      return { points: dedup, meta };
    }

    function findUnitAttr(el) {
      let cur = el;
      for (let i = 0; i < 5 && cur; i++) {
        if (cur.getAttribute) {
          const u = cur.getAttribute('unit') || cur.getAttribute('units') || cur.getAttribute('enhet');
          if (u) return u.toLowerCase();
        }
        cur = cur.parentElement;
      }
      return '';
    }

    function applyFilterAndRender() {
      if (!allPoints.length || !dataExtent) return;

      let from, to;
      const now = new Date();
      if (currentRange === 'today') {
        from = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0);
        to   = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59);
      } else if (currentRange === '7d') {
        from = now; to = new Date(now.getTime() + 7*24*3600*1000);
      } else if (currentRange === 'month') {
        from = new Date(now.getFullYear(), now.getMonth(), 1, 0, 0, 0);
        to   = new Date(now.getFullYear(), now.getMonth()+1, 0, 23, 59, 59);
      } else {
        from = dataExtent.tMin; to = dataExtent.tMax;
      }

      filtered = allPoints.filter(p => p.t >= from && p.t <= to);
      if (filtered.length === 0) {
        const center = now, twoDays = 2*24*3600*1000;
        filtered = allPoints.filter(p => Math.abs(p.t - center) <= twoDays);
      }

      renderStats();
      renderTable();
      renderChart();
    }

    function renderStats() {
      if (!filtered.length) {
        $('#stat-min').textContent = '–'; $('#stat-max').textContent = '–';
        $('#stat-avg').textContent = '–'; $('#stat-info').textContent = 'Ingen punkter i valgt tidsrom.'; return;
      }
      const vs = filtered.map(p => p.v);
      const vMin = Math.min(...vs), vMax = Math.max(...vs);
      const avg = vs.reduce((a, b) => a + b, 0) / vs.length;
      $('#stat-min').textContent = fmtNum(vMin) + ' m';
      $('#stat-max').textContent = fmtNum(vMax) + ' m';
      $('#stat-avg').textContent = fmtNum(avg) + ' m';
      const from = filtered[0].t, to = filtered[filtered.length-1].t;
      $('#stat-info').textContent = `Punkter: ${filtered.length} • Periode: ${fmtDate(from)} – ${fmtDate(to)}`;
    }

    function renderTable() {
      const tbody = $('#table-body');
      if (!filtered.length) { tbody.innerHTML = `<tr><td colspan="3" class="muted">Ingen data innen valgt periode.</td></tr>`; return; }
      const rows = filtered.slice(0, 2000).map(p => {
        const t = fmtDateTime(p.t);
        const v = fmtNum(p.v) + ' m';
        const src = p.src === 'obs' ? 'Observasjon' : (p.src === 'pred' ? 'Prognose' : (p.src === 'H' ? 'Høyvann' : p.src === 'L' ? 'Lavvann' : p.src));
        return `<tr><td class="nowrap">${t}</td><td>${v}</td><td class="muted">${src || ''}</td></tr>`;
      });
      tbody.innerHTML = rows.join('');
    }

    function renderChart() {
      const canvas = $('#chart');
      const wrap = $('#chart-wrap');
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      const w = wrap.clientWidth, h = wrap.clientHeight;
      if (w === 0 || h === 0) return;

      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      canvas.style.width = w + 'px'; canvas.style.height = h + 'px';

      const ctx = canvas.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0,0,w,h);

      if (!filtered.length) {
        ctx.fillStyle = getCSS('--muted'); ctx.font = '14px system-ui,-apple-system,Segoe UI,Roboto,Arial';
        ctx.fillText('Ingen data å vise', 10, 20); return;
      }

      const tMin = filtered[0].t.getTime(), tMax = filtered[filtered.length-1].t.getTime();
      let vMin = Math.min(...filtered.map(p => p.v));
      let vMax = Math.max(...filtered.map(p => p.v));
      if (vMax === vMin) { vMax += 0.5; vMin -= 0.5; }

      const padL=46, padR=12, padT=16, padB=26;
      const plotW = w - padL - padR, plotH = h - padT - padB;

      // Grid
      ctx.strokeStyle = getCSS('--grid'); ctx.lineWidth = 1;
      const yTicks = niceTicks(vMin, vMax, 5);
      ctx.beginPath();
      for (const yv of yTicks) {
        const y = padT + plotH - (yv - vMin) / (vMax - vMin) * plotH;
        ctx.moveTo(padL, Math.round(y)+0.5); ctx.lineTo(w - padR, Math.round(y)+0.5);
      }
      ctx.stroke();

      const xTicks = timeTicks(new Date(tMin), new Date(tMax), plotW);
      ctx.beginPath();
      for (const xt of xTicks) {
        const x = padL + (xt.getTime() - tMin) / (tMax - tMin) * plotW;
        ctx.moveTo(Math.round(x)+0.5, padT); ctx.lineTo(Math.round(x)+0.5, h - padB);
      }
      ctx.stroke();

      // Labels
      ctx.fillStyle = getCSS('--muted'); ctx.font = '12px system-ui,-apple-system,Segoe UI,Roboto,Arial';
      ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      for (const yv of yTicks) {
        const y = padT + plotH - (yv - vMin) / (vMax - vMin) * plotH;
        ctx.fillText(fmtNum(yv), padL - 6, y);
      }
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      for (const xt of xTicks) {
        const x = padL + (xt.getTime() - tMin) / (tMax - tMin) * plotW;
        ctx.fillText(fmtTickDate(xt, tMin, tMax), x, h - padB + 6);
      }

      // Kurve
      ctx.strokeStyle = getCSS('--accent'); ctx.lineWidth = 2; ctx.beginPath();
      filtered.forEach((p, i) => {
        const x = padL + (p.t.getTime() - tMin) / (tMax - tMin) * plotW;
        const y = padT + plotH - (p.v - vMin) / (vMax - vMin) * plotH;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      });
      ctx.stroke();

      // H/L markører
      const hasHL = filtered.some(p => p.src === 'H' || p.src === 'L');
      if (hasHL) {
        for (const p of filtered) {
          if (p.src !== 'H' && p.src !== 'L') continue;
          const x = padL + (p.t.getTime() - tMin) / (tMax - tMin) * plotW;
          const y = padT + plotH - (p.v - vMin) / (vMax - vMin) * plotH;
          ctx.fillStyle = p.src === 'H' ? getCSS('--good') : getCSS('--bad');
          ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2); ctx.fill();
        }
      }
    }

    // Utils
    function fmtNum(n){return (Math.round(n*100)/100).toLocaleString('nb-NO',{minimumFractionDigits:2,maximumFractionDigits:2})}
    function fmtDate(d){return d.toLocaleDateString('nb-NO')}
    function fmtDateTime(d){return d.toLocaleString('nb-NO',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).replace(',','')}
    function fmtTickDate(d,tMin,tMax){const spanDays=(tMax-tMin)/(1000*3600*24);return spanDays<=2?d.toLocaleTimeString('nb-NO',{hour:'2-digit'}):d.toLocaleDateString('nb-NO',{day:'2-digit',month:'2-digit'})}
    function getCSS(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
    function debounce(fn,ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}}
    function niceTicks(min,max,count=5){const span=max-min;if(span===0)return[min];const step=Math.pow(10,Math.floor(Math.log10(span/count)));const err=(count*step)/span;let s=step;if(err<=.15)s=step*10;else if(err<=.35)s=step*5;else if(err<=.75)s=step*2;const ticks=[];const start=Math.ceil(min/s)*s;for(let v=start;v<=max;v+=s)ticks.push(+v.toFixed(6));return ticks}
    function timeTicks(d0,d1,widthPx){const ms=d1-d0;const approx=Math.max(3,Math.floor(widthPx/110));const target=ms/approx;const steps=[5*60e3,10*60e3,15*60e3,30*60e3,60*60e3,2*60*60e3,3*60*60e3,6*60*60e3,12*60*60e3,24*60*60e3,2*24*60*60e3,3*24*60*60e3,7*24*60*60e3];let step=steps[0];for(const s of steps){if(s>=target){step=s;break}}const ticks=[];const start=alignTime(d0,step);for(let t=+start;t<=+d1+1;t+=step)ticks.push(new Date(t));return ticks}
    function alignTime(d,stepMs){const t=+d;if(stepMs>=24*3600*1000){return new Date(d.getFullYear(),d.getMonth(),d.getDate())}return new Date(Math.floor(t/stepMs)*stepMs)}
    function shortUrl(u){try{const url=new URL(u);return url.pathname.split('/').slice(-2).join('/')}catch{return u}}
    function showDebug(txt){const el=$('#debug');el.style.display='block';el.textContent=txt}
    function hideDebug(){const el=$('#debug');el.style.display='none';el.textContent=''}
    function escapeHtml(s){return String(s).replace(/[&<>"']/g,(m)=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]))}
    function bytesToHex(u8){return Array.from(u8).map(b=>b.toString(16).padStart(2,'0')).join(' ')}
  </script>

      --bg: #0d1117; --fg: #c9d1d9; --muted: #8b949e; --accent: #58a6ff;

      --tooltip-bg: rgba(13, 17, 23, 0.97); --tooltip-border: rgba(255,255,255,0.08);

      line-height: 1.45;
    }
    .tv-root *, .tv-root *::before, .tv-root *::after { box-sizing: border-box; }

    .tv-container { width: min(1100px, 100%); margin: 0 auto; padding: 12px 16px; }
    .tv-header { padding-top: 8px; }

    .tv-controls {
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0 10px;

    }

    .tv-btn {
      appearance: none; border: 1px solid var(--border); background: #161b22; color: var(--fg);
      padding: 8px 12px; border-radius: 10px; cursor: pointer; font-weight: 600; box-shadow: var(--shadow);
      transition: border-color .15s ease, background-color .15s ease, color .15s ease;
    }
    .tv-btn:hover { border-color: #3a434d; background: #19202a; }
    .tv-btn[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(88,166,255,0.18), var(--shadow); }

    /* Kompakt mobil */

<body>
  <div class="tv-root">
    <header class="tv-container tv-header">
      <h1 class="tv-h1" id="title">Tidevann i Bergen</h1>
      <div class="tv-sub" id="subtitle">Leser data fra Tidevann.xml. Dra i grafen eller bruk piltaster for å bla.</div><div class="tv-controls">
  <div class="tv-row" role="group" aria-label="Tidsvalg">
    <button class="tv-btn" data-range="1d" aria-pressed="true">24 t</button>
    <button class="tv-btn" data-range="3d">3 døgn</button>

  </div>
</div>
</header>

<main class="tv-container tv-main">
  <section class="tv-card" style="grid-column: 1 / -1;">
    <h2>Graf</h2>
    <div class="tv-pad">
      <div class="tv-chart-wrap" id="chart-wrap">
        <canvas class="tv-chart" id="chart" aria-label="Tidevannsgraf"></canvas>
      </div>

        <span><span class="tv-swatch"></span>Vannstand (m)</span>

      <div class="tv-stat-grid">
        <div class="tv-stat"><div class="tv-label">Minimum (visning)</div><div class="tv-val" id="stat-min">–</div></div>
        <div class="tv-stat"><div class="tv-label">Maksimum (visning)</div><div class="tv-val" id="stat-max">–</div></div>
        <div class="tv-stat"><div class="tv-label">Snitt (visning)</div><div class="tv-val" id="stat-avg">–</div></div>
      </div>
      <div class="tv-muted" style="margin-top:6px" id="stat-info">–</div>

</main>

<footer class="tv-footer">
  Tid vises i din lokale tidssone (<span id="tz"></span>). Legg til på hjem-skjermen for app-opplevelse.
</footer>
  </div>  <script>
    const XML_URLS = ['Tidevann.xml', 'https://skyrre.github.io/Tidevanns/Tidevann.xml'];

    let allPoints = [];
    let dataExtent = null; // { tMin, tMax, vMin, vMax }
    let viewFrom = null, viewTo = null;
    let viewLenMs = 24 * 3600e3; // 24 t
    let currentRangeKey = '1d';
    const PAGE_LOAD_TS = Date.now(); // for "nå-linje"
    let SITE = { name: 'Bergen', code: '', ref: '', lat: 60.3913, lon: 5.3221 };

    const $ = (s) => document.querySelector(s);
    const $$ = (s) => Array.from(document.querySelectorAll(s));

    document.addEventListener('DOMContentLoaded', () => {
      $('#tz').textContent = Intl.DateTimeFormat().resolvedOptions().timeZone || 'lokal tid';

      // Tidsvalg-knapper
      $$('.tv-btn[data-range]').forEach(btn => {
        btn.addEventListener('click', () => {
          $$('.tv-btn[data-range]').forEach(b => b.setAttribute('aria-pressed', 'false'));
          btn.setAttribute('aria-pressed', 'true');
          currentRangeKey = btn.dataset.range;
          viewLenMs = rangeToMs(currentRangeKey);
          placeWindowAroundNow();
          renderAll();
        });
      });

      // Piltaster for panorering
      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') { panBy(-0.5); e.preventDefault(); }
        else if (e.key === 'ArrowRight') { panBy(0.5); e.preventDefault(); }
      });

      // Drag-pan
      setupDragPan();

      // Layouthøyde
      layoutHeights();
      window.addEventListener('resize', debounce(() => { layoutHeights(); renderChart(); }, 80));
      window.addEventListener('orientationchange', () => setTimeout(() => { layoutHeights(); renderChart(); }, 100));

      loadXml();
    });

    async function loadXml() {
      try {
        const { text } = await fetchFirstWorking(XML_URLS);
        const cleanText = sanitizeXmlText(text);
        const doc = new DOMParser().parseFromString(cleanText, 'application/xml');
        if (doc.querySelector('parsererror')) throw new Error('Ugyldig XML');

        const parsed = parseSehavnivaXml(doc);
        allPoints = parsed.points;
        SITE = { ...SITE, ...parsed.meta };
        if (!allPoints.length) throw new Error('Fant ingen waterlevel-punkter i XML');

        if (SITE.name) {
          const titleTxt = `Tidevann i ${SITE.name}`;
          document.title = titleTxt;
          $('#title').textContent = titleTxt;
          $$('#subtitle').textContent = `Lokal fil: Tidevann.xml (enhet: meter, ref: $${SITE.ref || '—'})`;
        }

        const tMin = allPoints[0].t;
        const tMax = allPoints[allPoints.length - 1].t;
        const vs = allPoints.map(p => p.v).filter(Number.isFinite);
        const vMin = Math.min(...vs);
        const vMax = Math.max(...vs);
        dataExtent = { tMin, tMax, vMin, vMax };

        viewLenMs = rangeToMs(currentRangeKey);
        placeWindowAroundNow();
        renderAll();
      } catch (err) {
        console.error(err);
        $$('#subtitle').textContent = `Feil ved lesing av Tidevann.xml: $${err.message}`;
      }
    }

    function rangeToMs(key) {
      if (key === '1d') return 24 * 3600e3;
      if (key === '3d') return 3 * 24 * 3600e3;
      if (key === '7d') return 7 * 24 * 3600e3;
      return 24 * 3600e3;
    }

    function placeWindowAroundNow() {
      if (!dataExtent) return;
      let start = PAGE_LOAD_TS;
      let end = start + viewLenMs;

      const min = dataExtent.tMin.getTime();
      const max = dataExtent.tMax.getTime();
      if (end > max) { end = max; start = Math.max(min, end - viewLenMs); }
      if (start < min) { start = min; end = Math.min(max, start + viewLenMs); }

      viewFrom = new Date(start);
      viewTo = new Date(end);
    }

    function panBy(fraction) {
      const span = viewTo - viewFrom;
      let shift = span * fraction;
      let s = viewFrom.getTime() + shift;
      let e = viewTo.getTime() + shift;
      const min = dataExtent.tMin.getTime();
      const max = dataExtent.tMax.getTime();

      if (s < min) { e += (min - s); s = min; }
      if (e > max) { s -= (e - max); e = max; }

      viewFrom = new Date(s);
      viewTo = new Date(e);
      renderAll();
    }

    function setupDragPan() {
      const canvas = $('#chart');
      const wrap = $('#chart-wrap');
      let dragging = false;
      let dragStartX = 0;
      let startFrom = 0, startTo = 0;

      function getPlotW() {
        const pad = { L: 56, R: 16 };
        return { pad, plotW: wrap.clientWidth - pad.L - pad.R };
      }

      canvas.addEventListener('pointerdown', (e) => {
        dragging = true;
        const pt = ('touches' in e && e.touches && e.touches[0]) ? e.touches[0] : e;
        dragStartX = pt.clientX;
        startFrom = viewFrom.getTime();
        startTo = viewTo.getTime();
        canvas.setPointerCapture?.(e.pointerId || 1);
      });
      window.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        const pt = ('touches' in e && e.touches && e.touches[0]) ? e.touches[0] : e;
        const { plotW } = getPlotW();
        const span = startTo - startFrom;
        const dx = pt.clientX - dragStartX;
        const dt = -dx / plotW * span;
        let s = startFrom + dt;
        let e2 = startTo + dt;
        const min = dataExtent.tMin.getTime();
        const max = dataExtent.tMax.getTime();
        if (s < min) { e2 += (min - s); s = min; }
        if (e2 > max) { s -= (e2 - max); e2 = max; }
        viewFrom = new Date(s);
        viewTo = new Date(e2);
        renderAll();
      });
      window.addEventListener('pointerup', (e) => {
        dragging = false;
        canvas.releasePointerCapture?.(e.pointerId || 1);
      });
      canvas.addEventListener('pointerleave', () => { dragging = false; });
    }

    function renderAll() {
      renderStats();
      renderChart();
    }

    function filteredInView() {
      if (!dataExtent) return [];
      const from = viewFrom, to = viewTo;
      const lo = lowerBound(allPoints, from.getTime());
      const hi = upperBound(allPoints, to.getTime());
      return allPoints.slice(Math.max(0, lo - 1), Math.min(allPoints.length, hi + 1));
    }

    function renderStats() {
      const pts = filteredInView();
      if (!pts.length) {
        $('#stat-min').textContent = '–';
        $('#stat-max').textContent = '–';
        $('#stat-avg').textContent = '–';
        $('#stat-info').textContent = 'Ingen punkter i visningen.';
        return;
      }
      const vs = pts.map(p => p.v);
      const vMin = Math.min(...vs), vMax = Math.max(...vs);
      const avg = vs.reduce((a, b) => a + b, 0) / vs.length;

      $('#stat-min').textContent = `${fmtNum(vMin)} m`;
      $('#stat-max').textContent = `${fmtNum(vMax)} m`;
      $('#stat-avg').textContent = `${fmtNum(avg)} m`;
      $$('#stat-info').textContent = `Viser $${fmtDateTime(viewFrom)} → ${fmtDateTime(viewTo)} • Punkter: ${pts.length}`;
    }

    function renderChart() {
      const wrap = $('#chart-wrap');
      const canvas = $('#chart');
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      const w = wrap.clientWidth, h = wrap.clientHeight;
      if (w === 0 || h === 0) return;

      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
      const ctx = canvas.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, w, h);

      const pad = { L: 56, R: 16, T: 20, B: 32 };
      const plotW = w - pad.L - pad.R;
      const plotH = h - pad.T - pad.B;

      const pts = filteredInView();
      if (!pts.length) {
        ctx.fillStyle = getCSS('--muted');
        ctx.font = '14px system-ui,-apple-system,Segoe UI,Roboto,Arial';
        ctx.fillText('Ingen data i visningsvinduet', pad.L + 8, pad.T + 16);
        return;
      }

      // Y-buffer (min 0.2 m eller 10 %)
      let vMin = Math.min(...pts.map(p => p.v));
      let vMax = Math.max(...pts.map(p => p.v));
      const vSpan = Math.max(1e-6, vMax - vMin);
      const padY = Math.max(0.2, vSpan * 0.10);
      vMin -= padY; vMax += padY;

      const tMin = viewFrom.getTime();
      const tMax = viewTo.getTime();

      const xOf = (t) => pad.L + (t - tMin) / (tMax - tMin) * plotW;
      const yOf = (v) => pad.T + plotH - (v - vMin) / (vMax - vMin) * plotH;

      // Bakgrunn
      ctx.fillStyle = getCSS('--card');
      ctx.fillRect(pad.L, pad.T, plotW, plotH);

      // Dag/natt-bakgrunn + sol/måne
      drawDaylightLayer(ctx, pad, plotW, plotH, tMin, tMax, SITE.lat, SITE.lon, xOf, w);

      // Kurvesti
      const path = new Path2D();
      pts.forEach((p, i) => {
        const x = xOf(p.t.getTime());
        const y = yOf(p.v);
        if (i === 0) path.moveTo(x, y);
        else path.lineTo(x, y);
      });

      // Vannfyll
      ctx.save();
      const under = new Path2D(path);
      under.lineTo(xOf(pts[pts.length - 1].t.getTime()), pad.T + plotH);
      under.lineTo(xOf(pts[0].t.getTime()), pad.T + plotH);
      under.closePath();
      ctx.clip(under);

      const seaGrad = ctx.createLinearGradient(0, pad.T, 0, pad.T + plotH);
      seaGrad.addColorStop(0, getCSS('--sea-top'));
      seaGrad.addColorStop(1, getCSS('--sea-bottom'));
      ctx.fillStyle = seaGrad;
      ctx.fillRect(pad.L, pad.T, plotW, plotH);
      ctx.restore();

      // Rutenett Y + etiketter
      ctx.strokeStyle = getCSS('--grid');
      ctx.lineWidth = 1;
      const yTicks = niceTicks(vMin, vMax, 5);
      ctx.beginPath();
      for (const yv of yTicks) {
        const y = Math.round(yOf(yv)) + 0.5;
        ctx.moveTo(pad.L, y); ctx.lineTo(w - pad.R, y);
      }
      ctx.stroke();
      ctx.fillStyle = getCSS('--muted');
      ctx.font = '12px system-ui,-apple-system,Segoe UI,Roboto,Arial';
      ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      for (const yv of yTicks) ctx.fillText(fmtNum(yv), pad.L - 8, yOf(yv));

      // X-aksen: kun datoer ved døgnskiller (format "1. nov")
      const daysAll = dayTicks(new Date(tMin), new Date(tMax));
      const daysIn = daysAll.filter(d => d.getTime() >= tMin && d.getTime() <= tMax);
      if (daysIn.length === 0) daysIn.push(startOfDay(new Date(tMin)));
      // Gridlinjer
      ctx.beginPath();
      for (const d of daysIn) {
        const x = Math.round(xOf(d.getTime())) + 0.5;
        ctx.moveTo(x, pad.T); ctx.lineTo(x, h - pad.B);
      }
      ctx.stroke();
      // Datoetiketter
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      for (const d of daysIn) {
        const x = xOf(d.getTime());
        ctx.fillText(fmtTickDateShort(d), x, h - pad.B + 6);
      }

      // Nullinje
      if (vMin < 0 && vMax > 0) {
        ctx.strokeStyle = 'rgba(255,255,255,0.35)';
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        const y0 = yOf(0);
        ctx.moveTo(pad.L, y0); ctx.lineTo(w - pad.R, y0);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      // Kurve
      ctx.strokeStyle = getCSS('--accent');
      ctx.lineWidth = 2;
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      ctx.beginPath();
      pts.forEach((p, i) => {
        const x = xOf(p.t.getTime());
        const y = yOf(p.v);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      });
      ctx.stroke();

      // Verdi + klokkeslett ved Y-aksen (venstrekant)
      const vAxis = interpolateAtTime(viewFrom.getTime(), pts);
      if (Number.isFinite(vAxis)) {
        const y = yOf(vAxis);
        ctx.strokeStyle = 'rgba(255,255,255,0.6)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(pad.L - 4, y);
        ctx.lineTo(pad.L + 4, y);
        ctx.stroke();

        const valueLabel = (Math.round(vAxis * 10) / 10).toLocaleString('nb-NO', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
        const timeLabel = new Date(viewFrom).toLocaleTimeString('nb-NO', { hour: '2-digit', minute: '2-digit' });
        drawLabel(ctx, pad.L + 8, y - 10, `${valueLabel} m • ${timeLabel}`);
      }

      // Nå-linje (ved sidelast)
      if (PAGE_LOAD_TS >= tMin && PAGE_LOAD_TS <= tMax) {
        const xNow = xOf(PAGE_LOAD_TS);
        ctx.strokeStyle = 'rgba(255,255,255,0.55)';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([6, 4]);
        ctx.beginPath();
        ctx.moveTo(Math.round(xNow) + 0.5, pad.T);
        ctx.lineTo(Math.round(xNow) + 0.5, pad.T + plotH);
        ctx.stroke();
        ctx.setLineDash([]);
        drawLabel(ctx, Math.min(xNow + 8, w - pad.R - 60), pad.T + 6, 'Nå');
      }
    }

    // Dag/natt-lag: lysere dagslys + sol/måne med fase
    function drawDaylightLayer(ctx, pad, plotW, plotH, tMin, tMax, lat, lon, xOf, canvasW) {
      const topY = pad.T;
      const bottomY = pad.T + plotH;

      const dayStartLocal = (dms) => { const d = new Date(dms); return new Date(d.getFullYear(), d.getMonth(), d.getDate(), 0, 0, 0, 0); };
      let day = dayStartLocal(tMin);
      const endDay = dayStartLocal(tMax + 24*3600e3);

      while (day <= endDay) {
        const sun = getSunTimes(day, lat, lon);
        const dayStart = day.getTime();
        const dayEnd = dayStart + 24*3600e3;

        // Dagslys-fyll (lysere enn før)
        if (sun.alwaysDay) {
          fillDay(Math.max(xOf(Math.max(dayStart, tMin)), pad.L), Math.min(xOf(Math.min(dayEnd, tMax)), pad.L + plotW));
          // Sol ved lokalt "noon"
          const xNoon = xOf(sun.solarNoon.getTime());
          if (xNoon >= pad.L && xNoon <= pad.L + plotW) drawSun(ctx, xNoon, topY + 16, 7);
        } else if (sun.alwaysNight) {
          // Hele døgnet natt – tegner ingen dagslysfelt
          // Måne midt på døgnet
          const mid = dayStart + 12*3600e3;
          const xMoon = xOf(mid);
          if (xMoon >= pad.L && xMoon <= pad.L + plotW) {
            const mp = moonPhaseFrac(new Date(mid));
            drawMoon(ctx, xMoon, topY + 16, 7, mp.phase, mp.illum, mp.waxing);
          }
        } else if (sun.sunrise && sun.sunset) {
          const sr = sun.sunrise.getTime();
          const ss = sun.sunset.getTime();
          const xs = Math.max(xOf(Math.max(sr, tMin)), pad.L);
          const xe = Math.min(xOf(Math.min(ss, tMax)), pad.L + plotW);
          if (xe > xs) fillDay(xs, xe);

          // Sol ved solnoen
          const xNoon = xOf(sun.solarNoon.getTime());
          if (xNoon >= pad.L && xNoon <= pad.L + plotW) drawSun(ctx, xNoon, topY + 16, 7);

          // Måne: to natt-intervaller (kveld og morgen)
          const sunNext = getSunTimes(new Date(day.getFullYear(), day.getMonth(), day.getDate() + 1), lat, lon);

          // Natt før soloppgang (forrige kveld til soloppgang i dag) – håndteres av forrige dag
          // Natt etter solnedgang til neste soloppgang:
          if (sunNext.sunrise) {
            const nightStart = ss;
            const nightEnd = sunNext.sunrise.getTime();
            const mid = nightStart + (nightEnd - nightStart) / 2;
            if (mid >= tMin && mid <= tMax) {
              const xMoon = xOf(mid);
              if (xMoon >= pad.L && xMoon <= pad.L + plotW) {
                const mp = moonPhaseFrac(new Date(mid));
                drawMoon(ctx, xMoon, topY + 16, 7, mp.phase, mp.illum, mp.waxing);
              }
            }
          }
        }

        day = new Date(day.getFullYear(), day.getMonth(), day.getDate() + 1);
      }

      function fillDay(xs, xe) {
        xs = Math.max(xs, pad.L); xe = Math.min(xe, pad.L + plotW);
        if (xe <= xs) return;
        const grad = ctx.createLinearGradient(xs, 0, xe, 0);
        // Lysere verdier enn tidligere
        grad.addColorStop(0.00, 'rgba(255,255,255,0.10)');
        grad.addColorStop(0.50, 'rgba(255,255,255,0.18)');
        grad.addColorStop(1.00, 'rgba(255,255,255,0.10)');
        ctx.fillStyle = grad;
        ctx.fillRect(xs, topY, xe - xs, bottomY - topY);
      }
    }

    // Sol-ikon (diskret)
    function drawSun(ctx, x, y, r) {
      ctx.save();
      ctx.lineWidth = 1.25;
      ctx.strokeStyle = 'rgba(255,220,120,0.9)';
      ctx.fillStyle = 'rgba(255,220,120,0.25)';
      // stråler
      const rays = 8;
      for (let i = 0; i < rays; i++) {
        const a = (i / rays) * Math.PI * 2;
        const x1 = x + Math.cos(a) * (r + 2);
        const y1 = y + Math.sin(a) * (r + 2);
        const x2 = x + Math.cos(a) * (r + 5);
        const y2 = y + Math.sin(a) * (r + 5);
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      }
      // skive
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.restore();
    }

    // Månefase (0=new, 0.5=full, ~) – enkel, men god nok
    function moonPhaseFrac(date) {
      const SYNODIC = 29.53058867;
      const NEW_MOON_JD = 2451550.1; // 2000-01-06
      const jd = toJulian(date);
      const days = jd - NEW_MOON_JD;
      let phase = (days % SYNODIC) / SYNODIC;
      if (phase < 0) phase += 1;
      const illum = 0.5 * (1 - Math.cos(2 * Math.PI * phase)); // 0..1
      const waxing = phase < 0.5;
      return { phase, illum, waxing };
    }

    // Måne-ikon: liten disk med skygge etter fase
    function drawMoon(ctx, x, y, r, phase, illum, waxing) {
      ctx.save();
      const body = '#d9dde6', shadow = '#0f141a';
      // Måneskive
      ctx.fillStyle = body;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();

      // Skyggelegging – enkel to-sirkler-metode for crescent/gibbous
      // s går fra -r (full) til +r (ny)
      const s = (1 - 2 * illum) * r;
      ctx.fillStyle = shadow;
      ctx.beginPath(); ctx.arc(x + (waxing ? -s : s), y, r, 0, Math.PI * 2); ctx.fill();

      // Tynn outline
      ctx.strokeStyle = 'rgba(255,255,255,0.25)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }

    // Dag-ticks fra start-of-day(d0) til d1 (inklusiv)
    function startOfDay(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
    function dayTicks(d0, d1) {
      const ticks = [];
      let t = startOfDay(d0);
      while (t <= d1) {
        ticks.push(new Date(t));
        t = new Date(t.getFullYear(), t.getMonth(), t.getDate() + 1);
      }
      return ticks;
    }

    // Time-ticks (ikke brukt til etiketter lenger – beholdt for ev. senere)
    function hourTicksAdaptive(d0, d1, plotW) {
      const spanMs = d1 - d0;
      const hours = spanMs / 3600e3;
      const minPx = 48;
      const maxLabels = Math.max(3, Math.floor(plotW / minPx));
      const steps = [1, 2, 3, 4, 6, 8, 12];
      let step = steps[steps.length - 1];
      for (const s of steps) { if (hours / s <= maxLabels) { step = s; break; } }
      const ticks = [];
      const start = alignToNextHour(d0, step);
      for (let t = +start; t <= +d1 + 1; t += step * 3600e3) ticks.push(new Date(t));
      return { ticks, stepHours: step };
    }
    function alignToNextHour(d, stepHours) {
      const dt = new Date(d);
      dt.setMinutes(0, 0, 0);
      const start = new Date(dt.getFullYear(), dt.getMonth(), dt.getDate());
      while ((((dt.getTime() - start.getTime()) / 3600e3) % stepHours + stepHours) % stepHours !== 0) {
        dt.setHours(dt.getHours() + 1);
      }
      if (dt < d) dt.setHours(dt.getHours() + stepHours);
      return dt;
    }

    // Dag/natt-beregning (SunCalc-lignende)
    const RAD = Math.PI / 180;
    const J1970 = 2440588;
    const J2000 = 2451545;
    const DAY_MS = 86400000;
    function toJulian(date) { return date.valueOf() / DAY_MS - 0.5 + J1970; }
    function fromJulian(j) { return new Date((j + 0.5 - J1970) * DAY_MS); }
    function toDays(date) { return toJulian(date) - J2000; }
    function solarMeanAnomaly(d) { return RAD * (357.5291 + 0.98560028 * d); }
    function eclipticLongitude(M) {
      const C = RAD * (1.9148 * Math.sin(M) + 0.02 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M));
      const P = RAD * 102.9372;
      return M + C + P + Math.PI;
    }
    function declination(L) {
      const e = RAD * 23.4397;
      return Math.asin(Math.sin(e) * Math.sin(L));
    }
    function getSunTimes(localDay, lat, lon) {
      const Y = localDay.getFullYear(), M = localDay.getMonth(), D = localDay.getDate();
      const dateUTC = new Date(Date.UTC(Y, M, D, 0, 0, 0));
      const lw = -lon * RAD, phi = lat * RAD;
      const d = toDays(dateUTC);
      const n = Math.round(d - 0.0009 - lw / (2 * Math.PI));
      const ds = n + 0.0009 + lw / (2 * Math.PI);
      const Msol = solarMeanAnomaly(ds);
      const L = eclipticLongitude(Msol);
      const dec = declination(L);
      const Jnoon = J2000 + ds + 0.0053 * Math.sin(Msol) - 0.0069 * Math.sin(2 * L);

      const h0 = -0.83 * RAD;
      const cosOmega0 = (Math.sin(h0) - Math.sin(phi) * Math.sin(dec)) / (Math.cos(phi) * Math.cos(dec));

      if (cosOmega0 <= -1) {
        return { sunrise: null, sunset: null, alwaysDay: true, alwaysNight: false, solarNoon: fromJulian(Jnoon) };
      } else if (cosOmega0 >= 1) {
        return { sunrise: null, sunset: null, alwaysDay: false, alwaysNight: true, solarNoon: fromJulian(Jnoon) };
      } else {
        const omega0 = Math.acos(cosOmega0);
        const Jset = Jnoon + omega0 / (2 * Math.PI);
        const Jrise = Jnoon - omega0 / (2 * Math.PI);
        return { sunrise: fromJulian(Jrise), sunset: fromJulian(Jset), alwaysDay: false, alwaysNight: false, solarNoon: fromJulian(Jnoon) };
      }
    }

    // Dynamisk høyde (mer skjerm, ingen scrolling)
    function layoutHeights() {
      const vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
      const header = document.querySelector('.tv-header');
      const footer = document.querySelector('.tv-footer');
      const chartWrap = document.getElementById('chart-wrap');
      const legend = document.querySelector('.tv-legend');
      const stats = document.querySelector('.tv-stat-grid');

      const headerH = header ? header.getBoundingClientRect().height : 0;
      const footerH = footer && getComputedStyle(footer).display !== 'none' ? footer.getBoundingClientRect().height : 0;
      const padTopBottom = 16 + 16;
      const cardExtras = (legend && getComputedStyle(legend).display !== 'none' ? legend.getBoundingClientRect().height + 6 : 0)
                       + (stats && getComputedStyle(stats).display !== 'none' ? stats.getBoundingClientRect().height + 6 : 0);

      const available = vh - headerH - footerH - padTopBottom - cardExtras - 8;
      const minH = 260;
      chartWrap.style.height = Math.max(minH, available) + 'px';
    }

    // Interpolasjon / tegnehjelpere / utils
    function interpolateAtTime(t, pts) {
      if (!pts.length) return NaN;
      if (t <= pts[0].t.getTime()) return pts[0].v;
      if (t >= pts[pts.length-1].t.getTime()) return pts[pts.length-1].v;
      let i = 1;
      while (i < pts.length && pts[i].t.getTime() < t) i++;
      const p1 = pts[i-1], p2 = pts[i];
      const t1 = p1.t.getTime(), t2 = p2.t.getTime();
      const v1 = p1.v, v2 = p2.v;
      const a = (t - t1) / (t2 - t1);
      return v1 + a * (v2 - v1);
    }
    function drawLabel(ctx, x, y, text) {
      ctx.font = '12px system-ui,-apple-system,Segoe UI,Roboto,Arial';
      const paddingX = 6, paddingY = 4;
      const metrics = ctx.measureText(text);
      const w = metrics.width + paddingX * 2;
      const h = 18;
      const rx = 8;
      const yTop = y - h + 2;
      ctx.fillStyle = getCSS('--tooltip-bg');
      roundRect(ctx, x, yTop, w, h, rx); ctx.fill();
      ctx.strokeStyle = getCSS('--tooltip-border');
      ctx.lineWidth = 1; ctx.stroke();
      ctx.fillStyle = getCSS('--fg');
      ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
      ctx.fillText(text, x + paddingX, yTop + h / 2);
    }
    function roundRect(ctx, x, y, w, h, r) { r = Math.min(r, w/2, h/2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
    function fmtNum(n) { return (Math.round(n * 100) / 100).toLocaleString('nb-NO', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
    function fmtDateTime(d) { return d.toLocaleString('nb-NO', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }).replace(',', ''); }
    function fmtTickDateShort(d) {
      const s = d.toLocaleDateString('nb-NO', { day: 'numeric', month: 'short' });
      return s.replaceAll('.', '').trim();
    }
    function getCSS(v) { return getComputedStyle(document.querySelector('.tv-root')).getPropertyValue(v).trim(); }
    function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
    function niceTicks(min, max, count=5) {
      const span = max - min; if (span === 0) return [min];
      const step = Math.pow(10, Math.floor(Math.log10(span / count)));
      const err = (count * step) / span;
      let nice = step;
      if (err <= 0.15) nice = step * 10;
      else if (err <= 0.35) nice = step * 5;
      else if (err <= 0.75) nice = step * 2;
      const ticks = [];
      const start = Math.ceil(min / nice) * nice;
      for (let v = start; v <= max + 1e-9; v += nice) ticks.push(+v.toFixed(6));
      return ticks;
    }
    function lowerBound(arr, t) { let l = 0, r = arr.length; while (l < r) { const m = (l + r) >> 1; (arr[m].t.getTime() < t ? l = m + 1 : r = m); } return l; }
    function upperBound(arr, t) { let l = 0, r = arr.length; while (l < r) { const m = (l + r) >> 1; (arr[m].t.getTime() <= t ? l = m + 1 : r = m); } return l; }

    async function fetchFirstWorking(urls) {
      let lastErr = null;
      for (const u0 of urls) {
        try {
          const u = addCacheBuster(u0);
          const res = await fetch(u, { cache: 'no-cache', mode: 'same-origin' });
          if (!res.ok) { lastErr = new Error(`HTTP ${res.status} for ${u}`); continue; }
          const txt = await res.text();
          if (!/\<(tide|waterlevel)\b/i.test(txt.slice(0, 1000))) { lastErr = new Error(`Uventet innhold for ${u}`); continue; }
          return { text: txt, url: u };
        } catch (e) { lastErr = e; }
      }
      throw lastErr || new Error('Fant ingen gyldig Tidevann.xml');
    }
    function addCacheBuster(u) { try { const url = new URL(u, location.href); url.searchParams.set('v', String(Date.now())); return url.toString(); } catch { return u; } }
    function sanitizeXmlText(txt) { let s = txt.replace(/^\uFEFF/, ''); const i = s.indexOf('<'); if (i > 0) s = s.slice(i); const j = s.lastIndexOf('>'); if (j >= 0) s = s.slice(0, j + 1); return s; }

    function parseSehavnivaXml(doc) {
      const points = [];
      const loc = doc.querySelector('location');
      const meta = {
        name: loc?.getAttribute('name') || 'Bergen',
        code: loc?.getAttribute('code') || '',
        ref: doc.querySelector('reflevelcode')?.textContent?.trim() || '',
        lat: parseFloat(loc?.getAttribute('latitude') || '') || 60.3913,
        lon: parseFloat(loc?.getAttribute('longitude') || '') || 5.3221
      };
      const dataBlocks = Array.from(doc.querySelectorAll('locationdata > data'));
      for (const dataEl of dataBlocks) {
        const unit = (dataEl.getAttribute('unit') || '').toLowerCase();
        const type = (dataEl.getAttribute('type') || '').toLowerCase();
        for (const wl of dataEl.querySelectorAll('waterlevel')) {
          const time = wl.getAttribute('time');
          const valStr = wl.getAttribute('value');
          if (!time || !valStr) continue;
          const t = new Date(time); if (isNaN(t)) continue;
          let v = parseFloat(valStr); if (!isFinite(v)) continue;
          let u = unit || findUnitAttr(wl);
          if (u === 'cm') v = v / 100; else if (u === 'dm') v = v / 10;
          const flag = (wl.getAttribute('flag') || '').toLowerCase();
          const src = flag === 'obs' || type === 'observation' ? 'obs' : (type || flag || 'pred');
          points.push({ t, v, src });
        }
      }
      points.sort((a, b) => a.t - b.t || a.v - b.v);
      const dedup = []; const seen = new Set();
      for (const p of points) { const key = p.t.toISOString().slice(0,16); if (seen.has(key)) continue; seen.add(key); dedup.push(p); }
      return { points: dedup, meta };
    }
    function findUnitAttr(el) { let cur = el; for (let i = 0; i < 5 && cur; i++) { if (cur.getAttribute) { const u = cur.getAttribute('unit') || cur.getAttribute('units') || cur.getAttribute('enhet'); if (u) return u.toLowerCase(); } cur = cur.parentElement; } return ''; }
  </script></body>
